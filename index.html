
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wellness App</title>
  <meta name="theme-color" content="#081012" />
  <style>
    :root{--side:78px;--glass:rgba(255,255,255,.16);--border:rgba(255,255,255,.28);--text:#fff;--muted:rgba(255,255,255,.78);--accent:#57b7ff;--radius:22px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#081012;color:var(--text)}body{overflow:hidden}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:var(--side) 1fr;background:#081012;overflow:hidden}
    .splash{position:fixed;inset:0;z-index:99;background:#dfeadb url("assets/backgrounds/splash-screen-ocean.png") center/cover no-repeat;transition:opacity .45s ease,visibility .45s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .side{padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(2,7,10,.78);backdrop-filter:blur(16px);z-index:5;box-shadow:10px 0 30px rgba(0,0,0,.22)}
    .nav-wrap{position:relative;width:100%;display:grid;place-items:center}.nav{width:60px;min-height:58px;border-radius:18px;background:transparent;color:rgba(255,255,255,.76);display:grid;place-items:center;gap:3px;padding:7px 2px}.nav.active{background:linear-gradient(135deg,#ff646a,#ff3f49);color:#fff;box-shadow:0 10px 24px rgba(255,63,73,.25)}.nav svg{width:24px;height:24px;stroke-width:1.85}.nav span{font-size:8.8px;line-height:1.05;text-align:center;max-width:58px}.settings-mini{position:absolute;right:0;bottom:-3px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(10px)}.settings-mini svg{width:14px;height:14px}
    .main{position:relative;overflow:hidden}.screen{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transform:translateX(12px);transition:.22s ease}.screen.active{opacity:1;pointer-events:auto;transform:none}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 45%,rgba(0,0,0,.22))}
    #profile{background-image:url("assets/backgrounds/profile-bg.png"),linear-gradient(#556,#332)}#menu{background-image:url("assets/backgrounds/menu-bg.png"),linear-gradient(#354,#221)}#food{background-image:url("assets/backgrounds/food-scan-bg.png"),linear-gradient(#6a2,#631)}#water{background-image:url("assets/backgrounds/water-bg.png"),linear-gradient(#075,#023)}#workouts{background-image:url("assets/backgrounds/workouts-bg.png"),linear-gradient(#653,#134)}#steps{background-image:url("assets/backgrounds/steps-bg.png"),linear-gradient(#653,#134)}#coach{background-image:url("assets/backgrounds/coach-bg.png"),linear-gradient(#653,#134)}
    .content{position:relative;z-index:1;height:100%;overflow:auto;padding:14px 14px 22px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:8px}.title{margin:0;font-size:27px;line-height:1.02;letter-spacing:.04em;text-shadow:0 3px 16px rgba(0,0,0,.22)}.sub{margin:4px 0 0;color:var(--muted);font-size:12px}.card,.action{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.18)}.card{padding:12px}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}h3{margin:0 0 8px;font-size:16px;line-height:1.15}.label{font-size:11px;color:var(--muted)}.value{font-size:24px;font-weight:800;line-height:1.1;margin-top:4px}.note{font-size:11.5px;line-height:1.32;color:var(--muted);margin:6px 0 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:4px}input,select{width:100%;border-radius:13px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.17);color:#fff;padding:9px 10px;outline:none}option{color:#111}.action{min-height:74px;padding:10px;display:grid;grid-template-columns:44px 1fr 18px;gap:10px;align-items:center;text-align:left}.bubble{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.16)}.bubble svg{width:24px;height:24px}.action strong{font-size:17px;line-height:1.08}.action small{display:block;margin-top:3px;font-size:11px;line-height:1.22;color:var(--muted)}.action>i svg{width:18px;height:18px}.tabs{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.22);white-space:nowrap;font-size:12px}.tab.active{background:rgba(255,255,255,.34)}.level-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.level-tabs .tab{padding:8px 4px;text-align:center;font-size:11px;min-width:0}.small{border-radius:16px;padding:10px;background:rgba(0,0,0,.13);border:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{border-radius:999px;padding:8px 10px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.23);font-size:12px}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}.fill{height:100%;width:0;background:var(--accent);border-radius:inherit}.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.glass{aspect-ratio:1/.78;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:15px}.glass.done{background:rgba(87,183,255,.78)}.chat{display:grid;gap:10px;padding-bottom:76px}.msg{max-width:86%;padding:12px 13px;border-radius:19px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.23);backdrop-filter:blur(10px);font-size:13px;line-height:1.38}.user{justify-self:end}.ai{justify-self:start;background:rgba(35,48,42,.38)}.chatbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 46px;gap:8px;padding-top:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.28))}.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#27382d;display:grid;place-items:center}.modalwrap{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.36);padding:12px}.modalwrap.open{display:flex}.modal{width:min(100%,620px);max-height:86vh;overflow:auto;border-radius:26px;background:rgba(18,25,26,.78);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);padding:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead h2{margin:0;font-size:22px}.close{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center}
    @media(max-width:390px){:root{--side:72px}.nav{width:56px;min-height:55px}.nav span{font-size:8.2px}.content{padding-left:11px;padding-right:11px}.title{font-size:25px}.grid2{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.action strong{font-size:16px}.action small{font-size:10.5px}}
  </style>
</head>
<body>
<section id="splash" class="splash"></section>
<div class="app">
  <aside class="side">
    <div class="nav-wrap"><button class="nav active" data-go="profile"><i data-icon="user"></i><span data-t="navProfile"></span></button><button class="settings-mini" id="settingsBtn" aria-label="Settings" data-icon="settings"></button></div>
    <button class="nav" data-go="menu"><i data-icon="menu"></i><span data-t="navMenu"></span></button><button class="nav" data-go="food"><i data-icon="camera"></i><span data-t="navFood"></span></button><button class="nav" data-go="water"><i data-icon="drop"></i><span data-t="navWater"></span></button><button class="nav" data-go="workouts"><i data-icon="dumbbell"></i><span data-t="navWorkouts"></span></button><button class="nav" data-go="steps"><i data-icon="steps"></i><span data-t="navSteps"></span></button><button class="nav" data-go="coach"><i data-icon="leaf"></i><span data-t="navCoach"></span></button>
  </aside>
  <main class="main">
    <section id="profile" class="screen active"><div class="content"><div class="top"><div><h1 class="title" data-t="profileTitle"></h1><p class="sub" data-t="profileSub"></p></div></div><div class="grid2"><div class="card"><h3 data-t="myDetails"></h3><div class="fields"><div class="field"><label data-t="sex"></label><select id="sex"><option value="female" data-t="female"></option><option value="male" data-t="male"></option></select></div><div class="field"><label data-t="age"></label><input id="age" type="number" value="35" min="16" max="100"></div><div class="field"><label data-t="height"></label><input id="height" type="number" value="170" min="120" max="230"></div><div class="field"><label data-t="weight"></label><input id="weight" type="number" value="68" min="35" max="220" step="0.1"></div></div></div><div class="card"><h3 data-t="bodyGuide"></h3><div id="bmiValue" class="value">BMI: 23.5</div><p id="bmiText" class="note"></p></div></div><div class="stack"><button class="action"><span class="bubble" data-icon="measure"></span><span><strong data-t="measurements"></strong><small data-t="measurementsSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-t="startPhoto"></strong><small data-t="startPhotoSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-t="endPhoto"></strong><small data-t="endPhotoSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="chart"></span><span><strong data-t="monthResult"></strong><small data-t="monthResultSub"></small></span><i data-icon="chev"></i></button></div></div></section>
    <section id="menu" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-t="menuTitle"></h1><p class="sub" data-t="menuSub"></p></div></div><div class="card"><div class="tabs"><button class="tab active" data-t="balanced"></button><button class="tab" data-t="vegetarian"></button><button class="tab" data-t="vegan"></button></div></div><div class="card" style="margin-top:10px"><div class="tabs"><button class="tab active" data-t="fullMenu"></button><button class="tab" data-t="twoMeals"></button></div></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-t="week1"></strong><small data-t="weekSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-t="week2"></strong><small data-t="weekSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-t="week3"></strong><small data-t="repeatWeek1"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-t="week4"></strong><small data-t="repeatWeek2"></small></span><i data-icon="chev"></i></button></div></div></section>
    <section id="food" class="screen"><div class="content"><div class="top"><div><h1 class="title">Food Scan</h1><p class="sub" data-t="foodSub"></p></div></div><div class="stack"><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-t="takePhoto"></strong><small data-t="takePhotoSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="upload"></span><span><strong data-t="uploadPhoto"></strong><small data-t="uploadPhotoSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-t="myScans"></strong><small data-t="myScansSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="spark"></span><span><strong data-t="foodAdvice"></strong><small data-t="foodAdviceSub"></small></span><i data-icon="chev"></i></button></div></div></section>
    <section id="water" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-t="waterTitle"></h1><p class="sub" data-t="waterSub"></p></div></div><div class="card"><div class="grid2"><div><div class="label" data-t="dailyGoal"></div><div class="value">2 L</div></div><div><div class="label" data-t="today"></div><div class="value"><span id="waterNow">0</span> / 2 L</div></div></div><div class="progress" style="margin-top:10px"><div id="waterFill" class="fill"></div></div><div id="glasses" class="glasses"></div><p id="waterLeft" class="note"></p></div><div class="small" style="margin-top:10px"><button class="pill addWater" data-ml="250">+250 ml</button><button class="pill addWater" data-ml="500">+500 ml</button><button id="resetWater" class="pill" data-t="reset"></button></div><button class="action" style="margin-top:10px"><span class="bubble" data-icon="bell"></span><span><strong data-t="reminders"></strong><small data-t="remindersSub"></small></span><i data-icon="chev"></i></button></div></section>
    <section id="workouts" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-t="workoutsTitle"></h1><p class="sub" data-t="workoutsSub"></p></div></div><div class="card"><h3 data-t="level"></h3><div class="level-tabs"><button class="tab active" data-t="beginner"></button><button class="tab" data-t="middle"></button><button class="tab" data-t="advanced"></button></div></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-icon="fire"></span><span><strong data-t="cardio"></strong><small data-t="cardioSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="dumbbell"></span><span><strong data-t="strength"></strong><small data-t="strengthSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="yoga"></span><span><strong data-t="yoga"></strong><small data-t="yogaSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="spine"></span><span><strong data-t="spine"></strong><small data-t="spineSub"></small></span><i data-icon="chev"></i></button></div></div></section>
    <section id="steps" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-t="stepsTitle"></h1><p class="sub" data-t="stepsSub"></p></div></div><div class="card"><div class="label" data-t="stepsGoal"></div><div class="value">5 860 / 8 000</div><div class="progress" style="margin-top:10px"><div class="fill" style="width:73%"></div></div><div class="grid2" style="margin-top:10px"><div class="small"><b>4.3 km</b><span data-t="distance"></span></div><div class="small"><b>260 kcal</b><span data-t="calories"></span></div></div></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-icon="star"></span><span><strong data-t="streak"></strong><small data-t="streakSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-t="calendar"></strong><small data-t="calendarSub"></small></span><i data-icon="chev"></i></button></div></div></section>
    <section id="coach" class="screen"><div class="content"><div class="top"><div><h1 class="title">AI Coach</h1><p class="sub" data-t="coachSub"></p></div></div><div id="chat" class="chat"><div class="msg user" data-t="chatUser"></div><div class="msg ai" data-t="chatAi"></div><div class="tabs"><button class="tab quick" data-reply="motivation" data-t="noMotivation"></button><button class="tab quick" data-reply="tired" data-t="tired"></button><button class="tab quick" data-reply="broke" data-t="brokePlan"></button><button class="tab quick" data-reply="pain" data-t="pain"></button></div><div class="chatbar"><input id="coachInput" data-ph="coachPh"><button id="send" class="send" data-icon="send"></button></div></div></div></section>
  </main>
</div>
<div id="modal" class="modalwrap"><div class="modal"><div class="modalhead"><h2 data-t="settings"></h2><button id="close" class="close" data-icon="close"></button></div><div class="stack"><div class="card"><h3 data-t="language"></h3><select id="lang"></select></div><button class="action"><span class="bubble" data-icon="crown"></span><span><strong data-t="premium"></strong><small data-t="premiumSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="user"></span><span><strong data-t="account"></strong><small data-t="accountSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="bell"></span><span><strong data-t="notifications"></strong><small data-t="notificationsSub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="mail"></span><span><strong data-t="support"></strong><small>aislang.business@gmail.com</small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-t="privacy"></strong><small data-t="privacySub"></small></span><i data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-t="terms"></strong><small data-t="termsSub"></small></span><i data-icon="chev"></i></button></div></div></div>
<script>
const icons={user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="14" r="4"/></svg>',drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3s7 7.2 7 12a7 7 0 0 1-14 0c0-4.8 7-12 7-12z"/></svg>',dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>',steps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 20c-2 0-3-1.5-3-3.2 0-2.2 1.5-5.3 3.2-5.3 1.5 0 2.3 1.9 2.3 3.8C10.5 17.6 9.8 20 8 20z"/><path d="M16.3 14c-1.8-.2-2.4-2.4-2.1-4.3.3-2 1.4-3.7 2.9-3.5 1.8.2 2.8 3.6 2.4 5.7-.3 1.7-1.4 2.3-3.2 2.1z"/></svg>',leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 4C11 4 6 9 6 18c8 0 14-5 14-14z"/><path d="M6 18c3-4 6-6 10-8"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.8-1L14.4 3h-4.8L9.2 6a7 7 0 0 0-1.8 1L5 6 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5L5 18l2.4-1a7 7 0 0 0 1.8 1l.4 3h4.8l.4-3a7 7 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>',chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>',measure:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3v18M6 5h8M6 9h5M6 13h8M6 17h5"/></svg>',chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20h16M6 16l4-4 3 3 5-7M18 8v5h-5"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l1.5 5L18 10l-4.5 2L12 17l-1.5-5L6 10l4.5-2z"/></svg>',bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 9a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',fire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22c4 0 7-3 7-7 0-4-4-7-5-12-4 3-7 8-4 12-2-1-3-3-3-5-2 2-3 4-3 6 0 3 3 6 8 6z"/></svg>',yoga:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="5" r="2"/><path d="M12 7v6M8 12h8M5 19h14M8 19l4-6 4 6"/></svg>',spine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3c-2 3-2 5 0 7s2 4 0 6-2 3 0 5"/><path d="M9 5h6M9 10h6M9 15h6M9 20h6"/></svg>',star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9z"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg>',crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8l4 4 4-7 4 7 4-4v11H4z"/><path d="M4 19h16"/></svg>',mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>'};

const dict={en,uk,pl,de,fr,es,it,pt,nl,tr,ro,cs,sk,ka:en,ar:en,zh:en,ja:en,ko:en,hi:en,he:en};let lang=localStorage.healthLang||'en';const langEl=document.getElementById('lang');langs.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;langEl.appendChild(o)});langEl.value=lang;function t(k){return(dict[lang]&&dict[lang][k])||en[k]||k}function apply(){document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar'||lang==='he')?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));updateBMI();updateWater()}langEl.onchange=()=>{lang=langEl.value;localStorage.healthLang=lang;apply()};function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.go===id))}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));settingsBtn.onclick=()=>modal.classList.add('open');close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{[...b.parentElement.children].forEach(x=>x.classList.remove('active'));b.classList.add('active')});function updateBMI(){const h=Number(height.value)/100,w=Number(weight.value);if(!h||!w)return;const b=w/(h*h),min=18.5*h*h,max=24.9*h*h;bmiValue.textContent=`BMI: ${b.toFixed(1)}`;bmiText.textContent=`${t('healthyRange')}: ${min.toFixed(1)}–${max.toFixed(1)} kg`}['height','weight','age','sex'].forEach(id=>{const el=document.getElementById(id);['input','change','keyup','blur'].forEach(ev=>el.addEventListener(ev,updateBMI))});let water=Number(localStorage.waterMl||0),goal=2000;function updateWater(){glasses.innerHTML='';const done=Math.floor(water/250);for(let i=1;i<=8;i++){const b=document.createElement('button');b.className='glass'+(i<=done?' done':'');b.textContent=i;b.onclick=()=>{water=i*250;localStorage.waterMl=water;updateWater()};glasses.appendChild(b)}waterNow.textContent=(water/1000).toFixed(water%1000?2:0);waterFill.style.width=Math.min(100,water/goal*100)+'%';const left=Math.max(0,8-done);waterLeft.textContent=left?`${left} ${t('glassesLeft')}`:t('goalDone')}document.querySelectorAll('.addWater').forEach(b=>b.onclick=()=>{water=Math.min(goal,water+Number(b.dataset.ml));localStorage.waterMl=water;updateWater()});resetWater.onclick=()=>{water=0;localStorage.waterMl=0;updateWater()};const replies={motivation:'Choose one tiny action today: five minutes of movement, one glass of water, or a short walk. Keep the promise small enough to complete.',tired:'Tiredness is information, not failure. Lower the intensity and protect your routine without forcing your body.',broke:'One difficult moment does not erase your progress. Return to the next small step without punishing yourself.',pain:'If the pain is sharp, strong, or unusual, stop the exercise. Choose rest or gentle mobility today.'};function addMsg(text,who){const m=document.createElement('div');m.className='msg '+who;m.textContent=text;chat.insertBefore(m,chat.querySelector('.chatbar'));m.scrollIntoView({behavior:'smooth'})}document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{addMsg(b.textContent,'user');setTimeout(()=>addMsg(replies[b.dataset.reply]||replies.motivation,'ai'),180)});send.onclick=()=>{if(!coachInput.value.trim())return;addMsg(coachInput.value,'user');coachInput.value='';setTimeout(()=>addMsg(replies.motivation,'ai'),180)};coachInput.onkeydown=e=>{if(e.key==='Enter')send.click()};window.onload=()=>{apply();setTimeout(()=>splash.classList.add('hide'),1100)};
