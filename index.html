
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wellness App</title>
<style>
:root{--side:76px;--red:#ff4a55;--dark:#071014;--glass:rgba(255,255,255,.38);--glass2:rgba(255,255,255,.48);--line:rgba(255,255,255,.45);--text:#2b261f;--muted:rgba(43,38,31,.72)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071014;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:white;overflow:hidden}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:var(--side) 1fr}.splash{position:fixed;inset:0;z-index:99;background:url("assets/backgrounds/splash-screen-ocean.png") center/cover no-repeat;transition:.4s}.splash.hide{opacity:0;visibility:hidden}
.side{z-index:10;background:rgba(1,8,11,.82);padding:9px 6px;display:flex;flex-direction:column;gap:7px;align-items:center}.nav{width:60px;min-height:54px;border-radius:16px;background:transparent;color:#d8e0e0;display:grid;place-items:center;padding:5px 2px;gap:2px}.nav.active{background:linear-gradient(135deg,#ff6970,#ff4050);color:white}.nav svg{width:23px;height:23px}.nav span{font-size:8.2px;line-height:1.05;text-align:center}.spacer{flex:1}
.main{position:relative;overflow:hidden}.screen{position:absolute;inset:0;opacity:0;pointer-events:none;background:center/cover no-repeat;transition:.18s}.screen.active{opacity:1;pointer-events:auto}.screen:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.07)}
#profile{background-image:url("assets/backgrounds/profile-bg.png")}#menu{background-image:url("assets/backgrounds/menu-bg.png")}#food{background-image:url("assets/backgrounds/food-scan-bg.png")}#water{background-image:url("assets/backgrounds/water-bg.png")}#workouts{background-image:url("assets/backgrounds/workouts-bg.png")}#steps{background-image:url("assets/backgrounds/steps-bg.png")}#coach{background-image:url("assets/backgrounds/coach-bg.png")}
.content{position:relative;z-index:1;height:100%;overflow:auto;padding:14px 12px 24px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{text-align:center;margin:10px 0 12px}.title{font-size:28px;letter-spacing:.06em;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.45)}.sub{font-size:12px;color:rgba(255,255,255,.82);margin:4px 0 0}
.card,.action{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(4px);color:var(--text);box-shadow:0 10px 25px rgba(0,0,0,.10)}.card{border-radius:22px;padding:14px}.action{border-radius:22px;min-height:72px;padding:10px 12px;display:grid;grid-template-columns:46px 1fr 18px;gap:10px;align-items:center;text-align:left;width:100%}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}h3{margin:0 0 10px;font-size:16px}.value{font-size:25px;font-weight:800}.note{color:var(--muted);font-size:12px;line-height:1.35;margin:7px 0 0}.bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.27);border:1px solid rgba(255,255,255,.32)}.bubble svg{width:24px}.action strong{font-size:18px;line-height:1.08}.action small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.chev{font-size:28px;color:var(--text)}
.form{display:grid;gap:8px}.row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}.row label{font-size:13px;color:var(--muted);font-weight:650}.row input,.row select,.modal select{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(43,38,31,.18);background:rgba(255,255,255,.36);color:var(--text);padding:10px 36px 10px 12px;outline:none}.row input{padding-right:12px}
.seg{display:grid;gap:6px}.seg3{grid-template-columns:repeat(3,1fr)}.seg2{grid-template-columns:repeat(2,1fr)}.tab{border-radius:999px;padding:9px 5px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.35);color:var(--text);font-size:11px;min-width:0}.tab.active{background:rgba(255,255,255,.62)}.hidden{display:none!important}
.progress{height:9px;border-radius:9px;background:rgba(43,38,31,.2);overflow:hidden}.fill{height:100%;background:#55b9ff}.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.glass{border:1px solid rgba(43,38,31,.18);border-radius:16px;background:rgba(255,255,255,.28);height:52px;color:var(--text)}.glass.done{background:#55b9ff;color:white}.smallrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pill{border-radius:999px;padding:9px 10px;background:rgba(255,255,255,.38);color:var(--text)}
.chat{display:grid;gap:10px;padding-bottom:78px}.msg{max-width:88%;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(4px);padding:12px;color:var(--text);line-height:1.35}.user{justify-self:end}.ai{justify-self:start}.quick{display:flex;gap:7px;overflow:auto}.quick .tab{white-space:nowrap;padding:8px 12px}.chatbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 46px;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.12));padding-top:8px}.chatbar input{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.34);padding:12px;color:var(--text)}.send{border-radius:50%;background:white;color:#222;font-size:24px}
.modalwrap{position:fixed;inset:0;z-index:80;display:none;background:rgba(0,0,0,.35);padding:14px;align-items:flex-end}.modalwrap.open{display:flex}.modal{width:100%;max-height:88vh;overflow:auto;background:rgba(22,29,29,.94);border:1px solid rgba(255,255,255,.22);border-radius:26px;padding:16px;color:white}.modal .card,.modal .action{background:rgba(255,255,255,.13);color:white}.modal .action small,.modal .note{color:rgba(255,255,255,.72)}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modalhead h2{margin:0}.close{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.16);color:white;font-size:34px;line-height:1}.mgrid{display:grid;gap:8px}.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mrow label{font-size:12px;color:rgba(255,255,255,.72)}.mrow input{width:100%;border-radius:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:white;padding:10px}.save{width:100%;border-radius:18px;background:var(--red);color:white;padding:13px;font-weight:750;margin-top:10px}
@media(max-width:390px){:root{--side:72px}.nav{width:56px}.grid2{grid-template-columns:1fr}.title{font-size:25px}.action strong{font-size:16px}.row{grid-template-columns:82px 1fr}}
</style>
</head>
<body>
<div id="splash" class="splash"></div>
<div class="app">
<aside class="side">
<button class="nav active" data-go="profile"><i data-ico="user"></i><span data-t="navProfile"></span></button>
<button class="nav" data-go="menu"><i data-ico="menu"></i><span data-t="navMenu"></span></button>
<button class="nav" data-go="food"><i data-ico="camera"></i><span data-t="navFood"></span></button>
<button class="nav" data-go="water"><i data-ico="drop"></i><span data-t="navWater"></span></button>
<button class="nav" data-go="workouts"><i data-ico="dumbbell"></i><span data-t="navWorkouts"></span></button>
<button class="nav" data-go="steps"><i data-ico="steps"></i><span data-t="navSteps"></span></button>
<button class="nav" data-go="coach"><i data-ico="leaf"></i><span data-t="navCoach"></span></button>
<div class="spacer"></div>
<button class="nav" id="openSettings" type="button"><i data-ico="settings"></i><span data-t="settings"></span></button>
</aside>
<main class="main">
<section id="profile" class="screen active"><div class="content">
 <div class="top"><h1 class="title" data-t="profileTitle"></h1><p class="sub" data-t="profileSub"></p></div>
 <div class="grid2">
  <div class="card"><h3 data-t="myDetails"></h3><div class="form">
   <div class="row"><label data-t="sex"></label><select id="sex"><option value="female" data-t="female"></option><option value="male" data-t="male"></option></select></div>
   <div class="row"><label data-t="age"></label><input id="age" type="number" value="35"></div>
   <div class="row"><label data-t="height"></label><input id="height" type="number" value="170"></div>
   <div class="row"><label data-t="weight"></label><input id="weight" type="number" value="68"></div>
  </div></div>
  <div class="card"><h3 data-t="bodyGuide"></h3><div id="bmiValue" class="value"></div><p id="bmiText" class="note"></p><p id="targetText" class="note"></p></div>
 </div>
 <div class="stack">
  <button class="action" id="openMeasures" type="button"><span class="bubble" data-ico="measure"></span><span><strong data-t="measurements"></strong><small id="measureSummary" data-t="measurementsSub"></small></span><span class="chev">›</span></button>
  <button class="action" type="button"><span class="bubble" data-ico="camera"></span><span><strong data-t="startPhoto"></strong><small data-t="startPhotoSub"></small></span><span class="chev">›</span></button>
  <button class="action" type="button"><span class="bubble" data-ico="camera"></span><span><strong data-t="endPhoto"></strong><small data-t="endPhotoSub"></small></span><span class="chev">›</span></button>
  <button class="action" type="button"><span class="bubble" data-ico="chart"></span><span><strong data-t="monthResult"></strong><small data-t="monthResultSub"></small></span><span class="chev">›</span></button>
 </div>
</div></section>

<section id="menu" class="screen"><div class="content">
 <div class="top"><h1 class="title" data-t="menuTitle"></h1></div>
 <div class="card"><div class="seg seg3"><button class="tab active diet" data-diet="balanced" data-t="balanced"></button><button class="tab diet" data-diet="vegetarian" data-t="vegetarian"></button><button class="tab diet" data-diet="vegan" data-t="vegan"></button></div></div>
 <div id="balancedBox" class="card" style="margin-top:10px"><div class="seg seg2"><button class="tab active" data-t="fullMenu"></button><button class="tab" data-t="twoMeals"></button></div></div>
 <div id="vegBox" class="card hidden" style="margin-top:10px"><p class="note" data-t="vegLater"></p></div>
 <div class="stack" style="margin-top:10px">
  <button class="action"><span class="bubble" data-ico="calendar"></span><span><strong data-t="week1"></strong><small data-t="weekSub"></small></span><span class="chev">›</span></button>
  <button class="action"><span class="bubble" data-ico="calendar"></span><span><strong data-t="week2"></strong><small data-t="weekSub"></small></span><span class="chev">›</span></button>
  <button class="action"><span class="bubble" data-ico="calendar"></span><span><strong data-t="week3"></strong><small data-t="repeatWeek1"></small></span><span class="chev">›</span></button>
  <button class="action"><span class="bubble" data-ico="calendar"></span><span><strong data-t="week4"></strong><small data-t="repeatWeek2"></small></span><span class="chev">›</span></button>
 </div>
</div></section>

<section id="food" class="screen"><div class="content"><div class="top"><h1 class="title" data-t="foodTitle"></h1><p class="sub" data-t="foodSub"></p></div><div class="stack">
<button class="action"><span class="bubble" data-ico="camera"></span><span><strong data-t="takePhoto"></strong><small data-t="takePhotoSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="upload"></span><span><strong data-t="uploadPhoto"></strong><small data-t="uploadPhotoSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="file"></span><span><strong data-t="myScans"></strong><small data-t="myScansSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="spark"></span><span><strong data-t="foodAdvice"></strong><small data-t="foodAdviceSub"></small></span><span class="chev">›</span></button>
</div></div></section>

<section id="water" class="screen"><div class="content"><div class="top"><h1 class="title" data-t="waterTitle"></h1><p class="sub" data-t="waterSub"></p></div><div class="card"><div class="grid2"><div><div class="note" data-t="dailyGoal"></div><div class="value">2 L</div></div><div><div class="note" data-t="today"></div><div class="value"><span id="waterNow">0</span> / 2 L</div></div></div><div class="progress"><div id="waterFill" class="fill"></div></div><div id="glasses" class="glasses"></div><p id="waterLeft" class="note"></p></div><div class="smallrow"><button class="pill addWater" data-ml="250">+250 ml</button><button class="pill addWater" data-ml="500">+500 ml</button></div><button id="resetWater" class="pill" style="margin-top:8px" data-t="reset"></button></div></section>

<section id="workouts" class="screen"><div class="content"><div class="top"><h1 class="title" data-t="workoutsTitle"></h1><p class="sub" data-t="workoutsSub"></p></div><div class="card"><h3 data-t="level"></h3><div class="seg seg3"><button class="tab active" data-t="beginner"></button><button class="tab" data-t="middle"></button><button class="tab" data-t="advanced"></button></div></div><div class="stack" style="margin-top:10px">
<button class="action"><span class="bubble" data-ico="fire"></span><span><strong data-t="cardio"></strong><small data-t="cardioSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="dumbbell"></span><span><strong data-t="strength"></strong><small data-t="strengthSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="yoga"></span><span><strong data-t="yoga"></strong><small data-t="yogaSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="spine"></span><span><strong data-t="spine"></strong><small data-t="spineSub"></small></span><span class="chev">›</span></button>
</div></div></section>

<section id="steps" class="screen"><div class="content"><div class="top"><h1 class="title" data-t="stepsTitle"></h1><p class="sub" data-t="stepsSub"></p></div><div class="card"><div class="note" data-t="stepsGoal"></div><div class="value">5 860 / 8 000</div><div class="progress"><div class="fill" style="width:73%"></div></div><div class="smallrow"><div class="pill">4.3 km</div><div class="pill">260 kcal</div></div></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-ico="star"></span><span><strong data-t="streak"></strong><small data-t="streakSub"></small></span><span class="chev">›</span></button><button class="action"><span class="bubble" data-ico="calendar"></span><span><strong data-t="calendar"></strong><small data-t="calendarSub"></small></span><span class="chev">›</span></button></div></div></section>

<section id="coach" class="screen"><div class="content"><div class="top"><h1 class="title" data-t="coachTitle"></h1><p class="sub" data-t="coachSub"></p></div><div id="chat" class="chat"><div class="msg user" data-t="chatUser"></div><div class="msg ai" data-t="chatAi"></div><div class="quick"><button class="tab quickBtn" data-reply="motivation" data-t="noMotivation"></button><button class="tab quickBtn" data-reply="tired" data-t="tired"></button><button class="tab quickBtn" data-reply="broke" data-t="brokePlan"></button><button class="tab quickBtn" data-reply="pain" data-t="pain"></button></div><div class="chatbar"><input id="coachInput" data-ph="coachPh"><button id="send" class="send">↑</button></div></div></div></section>
</main>
</div>

<div id="settingsModal" class="modalwrap"><div class="modal" role="dialog"><div class="modalhead"><h2 data-t="settings"></h2><button id="closeSettings" class="close" type="button">×</button></div><div class="stack">
<div class="card"><h3 data-t="language"></h3><select id="lang"></select></div>
<button class="action"><span class="bubble" data-ico="crown"></span><span><strong data-t="premium"></strong><small data-t="premiumSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="user"></span><span><strong data-t="account"></strong><small data-t="accountSub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="mail"></span><span><strong data-t="support"></strong><small>aislang.business@gmail.com</small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="file"></span><span><strong data-t="privacy"></strong><small data-t="privacySub"></small></span><span class="chev">›</span></button>
<button class="action"><span class="bubble" data-ico="file"></span><span><strong data-t="terms"></strong><small data-t="termsSub"></small></span><span class="chev">›</span></button>
</div></div></div>

<div id="measureModal" class="modalwrap"><div class="modal" role="dialog"><div class="modalhead"><h2 data-t="measurements"></h2><button id="closeMeasures" class="close" type="button">×</button></div><div class="mgrid">
<div class="mrow"><label data-t="chest"></label><input id="mChest" type="number" placeholder="cm"></div>
<div class="mrow"><label data-t="waist"></label><input id="mWaist" type="number" placeholder="cm"></div>
<div class="mrow"><label data-t="belly"></label><input id="mBelly" type="number" placeholder="cm"></div>
<div class="mrow"><label data-t="hips"></label><input id="mHips" type="number" placeholder="cm"></div>
<div class="mrow"><label data-t="arm"></label><input id="mArm" type="number" placeholder="cm"></div>
<div class="mrow"><label data-t="thigh"></label><input id="mThigh" type="number" placeholder="cm"></div>
<button id="saveMeasures" class="save" type="button" data-t="save"></button>
</div></div></div>

<script>
const I={user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c2-4 5-6 8-6s6 2 8 6"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="14" r="4"/></svg>',drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3s7 7 7 12a7 7 0 0 1-14 0c0-5 7-12 7-12z"/></svg>',dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>',steps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 20c-2 0-3-1.5-3-3.2 0-2.2 1.5-5.3 3.2-5.3 1.5 0 2.3 1.9 2.3 3.8C10.5 17.6 9.8 20 8 20z"/><path d="M16 14c-2-.2-2.4-2.4-2.1-4.3.3-2 1.4-3.7 2.9-3.5 1.8.2 2.8 3.6 2.4 5.7-.3 1.7-1.4 2.3-3.2 2.1z"/></svg>',leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 4C11 4 6 9 6 18c8 0 14-5 14-14z"/><path d="M6 18c3-4 6-6 10-8"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.8-1L14.4 3h-4.8L9.2 6a7 7 0 0 0-1.8 1L5 6 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5L5 18l2.4-1a7 7 0 0 0 1.8 1l.4 3h4.8l.4-3a7 7 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>',measure:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3v18M6 5h8M6 9h5M6 13h8M6 17h5"/></svg>',chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20h16M6 16l4-4 3 3 5-7"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l1.5 5L18 10l-4.5 2L12 17l-1.5-5L6 10l4.5-2z"/></svg>',bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 9a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>',calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',fire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22c4 0 7-3 7-7 0-4-4-7-5-12-4 3-7 8-4 12-2-1-3-3-3-5-2 2-3 4-3 6 0 3 3 6 8 6z"/></svg>',yoga:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="5" r="2"/><path d="M12 7v6M8 12h8M5 19h14M8 19l4-6 4 6"/></svg>',spine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3c-2 3-2 5 0 7s2 4 0 6-2 3 0 5"/><path d="M9 5h6M9 10h6M9 15h6M9 20h6"/></svg>',star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9z"/></svg>',crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8l4 4 4-7 4 7 4-4v11H4z"/></svg>',mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>'};
document.querySelectorAll('[data-ico]').forEach(e=>e.innerHTML=I[e.dataset.ico]||'');

function makeDict(code){let arr=(code==='uk'||code==='ja')?keys[code]:keys.en.slice(); if(labelMap[code]) for(let i=0;i<7;i++)arr[i]=labelMap[code][i]; let o={}; names.forEach((n,i)=>o[n]=arr[i]||keys.en[i]||n); return o}

const langSel=document.getElementById('lang'); langs.forEach(([c,n])=>{let o=document.createElement('option');o.value=c;o.textContent=n;langSel.appendChild(o)}); langSel.value=lang;
function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=(lang==='ar'||lang==='he')?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));updateBMI();updateWater();loadMeasures()}

document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function openModal(m){m.classList.add('open')} function closeModal(m){m.classList.remove('open')}

document.querySelectorAll('.diet').forEach(b=>b.onclick=()=>{document.querySelectorAll('.diet').forEach(x=>x.classList.remove('active'));b.classList.add('active');let ok=b.dataset.diet==='balanced';balancedBox.classList.toggle('hidden',!ok);vegBox.classList.toggle('hidden',ok)});

function updateBMI(){let h=+height.value/100,w=+weight.value;if(!h||!w)return;let bmi=w/(h*h),min=18.5*h*h,max=24.9*h*h,tm=(sex.value==='female'?20.0:21.0)*h*h,tx=(sex.value==='female'?22.0:23.2)*h*h;bmiValue.textContent=`BMI: ${bmi.toFixed(1)}`;bmiText.textContent=`${t('healthyRange')}: ${min.toFixed(0)}–${max.toFixed(0)} kg`;targetText.textContent=`${t('wellnessTarget')}: ${tm.toFixed(0)}–${tx.toFixed(0)} kg`}
['sex','age','height','weight'].forEach(id=>['input','change','blur','keyup'].forEach(ev=>document.getElementById(id).addEventListener(ev,updateBMI)));
const mid=['Chest','Waist','Belly','Hips','Arm','Thigh']; function loadMeasures(){let d=JSON.parse(localStorage.measures||'{}');mid.forEach(n=>{let el=document.getElementById('m'+n); if(el)el.value=d[n]||''});let vals=mid.map(n=>d[n]).filter(Boolean);measureSummary.textContent=vals.length?vals.map(v=>v+' cm').join(' · '):t('measurementsSub')}
saveMeasures.onclick=()=>{let d={};mid.forEach(n=>d[n]=document.getElementById('m'+n).value.trim());localStorage.measures=JSON.stringify(d);loadMeasures();closeModal(measureModal)};
let water=+localStorage.waterMl||0,goal=2000;function updateWater(){glasses.innerHTML='';let done=Math.floor(water/250);for(let i=1;i<=8;i++){let b=document.createElement('button');b.className='glass'+(i<=done?' done':'');b.textContent=i;b.onclick=()=>{water=i*250;localStorage.waterMl=water;updateWater()};glasses.appendChild(b)}waterNow.textContent=(water/1000).toFixed(water%1000?2:0);waterFill.style.width=Math.min(100,water/goal*100)+'%';waterLeft.textContent=done>=8?t('goalDone'):(8-done)+' '+t('glassesLeft')}
document.querySelectorAll('.addWater').forEach(b=>b.onclick=()=>{water=Math.min(goal,water+(+b.dataset.ml));localStorage.waterMl=water;updateWater()}); resetWater.onclick=()=>{water=0;localStorage.waterMl=0;updateWater()};
function reply(k){return {motivation:t('replyMotivation'),tired:t('replyTired'),broke:t('replyBroke'),pain:t('replyPain')}[k]||t('replyMotivation')} function addMsg(txt,cls){let d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;chat.insertBefore(d,chat.querySelector('.chatbar'))}
document.querySelectorAll('.quickBtn').forEach(b=>b.onclick=()=>{addMsg(b.textContent,'user');setTimeout(()=>addMsg(reply(b.dataset.reply),'ai'),100)});send.onclick=()=>{if(coachInput.value.trim()){addMsg(coachInput.value,'user');coachInput.value='';setTimeout(()=>addMsg(t('replyMotivation'),'ai'),100)}};coachInput.onkeydown=e=>{if(e.key==='Enter')send.click()};
