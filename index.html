<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Wellness App</title>
<style>
:root{--side:78px;--dark:#071014;--red:#ff4654;--glass:rgba(255,255,255,.34);--line:rgba(255,255,255,.42);--ink:#27231e;--muted:rgba(39,35,30,.72);--radius:24px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071014;color:#fff;overflow:hidden}button,input,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden;background:#071014}.splash{position:fixed;inset:0;z-index:100;background:#dfe9e2 url("assets/backgrounds/splash-screen-ocean.png") center/cover no-repeat;transition:.45s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.side{z-index:5;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(2,8,11,.82);backdrop-filter:blur(16px)}.nav{width:60px;min-height:56px;border-radius:18px;display:grid;place-items:center;gap:3px;padding:7px 2px;color:rgba(255,255,255,.78)}.nav.active{background:linear-gradient(135deg,#ff6470,#ff3d4b);color:#fff;box-shadow:0 12px 24px rgba(255,61,75,.25)}.nav svg{width:24px;height:24px;stroke-width:1.85}.nav span{font-size:8.6px;line-height:1.05;text-align:center;max-width:60px;word-break:break-word}.spacer{flex:1}
.main{position:relative;overflow:hidden}.screen{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transition:.2s;transform:translateX(8px)}.screen.active{opacity:1;pointer-events:auto;transform:none}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.03) 48%,rgba(0,0,0,.12))}
#profile{background-image:url("assets/backgrounds/profile-bg.png")}#meal{background-image:url("assets/backgrounds/menu-bg.png")}#food{background-image:url("assets/backgrounds/food-scan-bg.png")}#water{background-image:url("assets/backgrounds/water-bg.png")}#workouts{background-image:url("assets/backgrounds/workouts-bg.png")}#steps{background-image:url("assets/backgrounds/steps-bg.png")}#coach{background-image:url("assets/backgrounds/coach-bg.png")}
.content{position:relative;z-index:1;height:100%;overflow:auto;padding:14px 14px 22px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{text-align:center;min-height:52px;margin-bottom:8px;display:grid;place-items:center}.title{font-size:clamp(22px,6.5vw,30px);letter-spacing:.04em;line-height:1.04;margin:0;text-shadow:0 3px 16px rgba(0,0,0,.45)}.sub{font-size:12px;margin:4px 0 0;color:rgba(255,255,255,.82);text-shadow:0 2px 10px rgba(0,0,0,.35)}
.card,.action{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(5px);box-shadow:0 12px 30px rgba(0,0,0,.12);color:var(--ink)}.card{padding:13px}.grid2{display:grid;grid-template-columns:1.22fr .95fr;gap:10px;margin-bottom:10px}h3{font-size:16px;line-height:1.1;margin:0 0 10px}.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}label{font-size:11.5px;color:var(--muted)}input,select{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(39,35,30,.15);background:rgba(255,255,255,.3);color:var(--ink);outline:none;padding:9px 10px}select{padding-right:26px;font-size:13px}option{color:#111;background:#fff}.value{font-size:28px;font-weight:800;line-height:1.06}.note{font-size:11.5px;line-height:1.35;color:var(--muted);margin:7px 0 0}
.stack{display:grid;gap:10px}.action{min-height:74px;padding:10px;display:grid;grid-template-columns:48px 1fr 16px;align-items:center;gap:10px;text-align:left}.bubble{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.25)}.bubble svg{width:25px;height:25px}.action strong{font-size:17px;line-height:1.08}.action small{display:block;font-size:11.2px;line-height:1.25;color:var(--muted);margin-top:3px}.chev svg{width:17px;height:17px}
.segment{display:grid;gap:7px}.segment.three{grid-template-columns:repeat(3,1fr)}.segment.two{grid-template-columns:repeat(2,1fr)}.tab{padding:9px 4px;border-radius:999px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.35);color:var(--ink);font-size:11px;text-align:center;min-width:0}.tab.active{background:rgba(255,255,255,.62)}.hidden{display:none!important}.info{font-size:13px;text-align:center;line-height:1.35}.progress{height:8px;border-radius:999px;background:rgba(39,35,30,.18);overflow:hidden}.fill{height:100%;border-radius:999px;background:#58b9ff}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{border-radius:999px;background:rgba(255,255,255,.36);border:1px solid rgba(255,255,255,.4);padding:8px 12px;color:var(--ink);font-size:12px}.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.glass{position:relative;height:48px;border-radius:8px 8px 16px 16px;background:rgba(255,255,255,.42);border:2px solid rgba(39,35,30,.34);color:var(--ink);box-shadow:inset 0 -8px 0 rgba(88,185,255,.12);transition:.18s}.glass:after{content:"";position:absolute;right:-8px;top:13px;width:11px;height:17px;border:2px solid rgba(39,35,30,.34);border-left:0;border-radius:0 9px 9px 0}.glass.done{background:linear-gradient(180deg,rgba(255,255,255,.58) 0 28%,rgba(88,185,255,.9) 29% 100%);border-color:rgba(35,117,168,.72);box-shadow:inset 0 -10px 0 rgba(35,117,168,.2)}.glass.done:after{border-color:rgba(35,117,168,.72)}
.chat{display:grid;gap:10px;padding-bottom:70px}.msg{max-width:86%;padding:12px 13px;border-radius:19px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.32);color:var(--ink);font-size:13px;line-height:1.36;backdrop-filter:blur(5px)}.user{justify-self:end}.ai{justify-self:start}.quick{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.chatbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 46px;gap:8px;padding-top:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.15))}.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#25352d;display:grid;place-items:center}
.foodPanel{display:grid;gap:12px}.foodPreviewWrap{position:relative}.foodPreview{width:100%;max-height:260px;object-fit:cover;border-radius:22px;border:1px solid rgba(255,255,255,.28)}.clearCurrentScan{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:14px;background:rgba(255,255,255,.9);color:#1d1a16;font-size:24px;font-weight:800;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}.foodAiBox{background:rgba(255,255,255,.82)!important;border:1px solid rgba(39,35,30,.18)!important;color:#1f1b18!important;border-radius:22px!important;padding:13px!important;box-shadow:0 12px 28px rgba(0,0,0,.13)}.foodAiBox strong{color:#17130f;font-size:17px}.foodAiBox .scanMeta{color:rgba(31,27,24,.76)!important;font-size:13px;line-height:1.35}.foodAiBox .foodItemName{font-size:15px;color:#17130f}.manualBox{display:grid;gap:10px}.scanCard{position:relative;padding-right:48px}.scanMeta{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}.scanThumb{width:100%;max-height:150px;object-fit:cover;border-radius:16px;margin-bottom:8px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;background:rgba(18,25,26,.92);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.fileInput{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:0!important;cursor:pointer!important;z-index:6!important}.filePick{position:relative;overflow:hidden;cursor:pointer}.filePick .bubble,.filePick span,.filePick .chev{pointer-events:none}
.modalWrap{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);padding:12px}.modalWrap.open{display:flex}.modal{width:min(100%,620px);max-height:86vh;overflow:auto;border-radius:26px;background:rgba(18,25,26,.9);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);padding:14px;color:#fff}.modal .card,.modal .action{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}.modal label,.modal .note,.modal small{color:rgba(255,255,255,.74)}.modal input,.modal select{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modalHead h2{margin:0;font-size:23px}.closeBtn{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#fff}.measureGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.saveBtn{width:100%;border-radius:18px;background:linear-gradient(135deg,#ff6470,#ff3d4b);padding:13px;color:#fff;font-weight:700;margin-top:10px}
.selectBtn{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(39,35,30,.15);background:rgba(255,255,255,.3);color:var(--ink);outline:none;padding:9px 10px;display:flex;align-items:center;justify-content:space-between}
.selectBtn span:first-child{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selectArrow{opacity:.75;font-size:13px}
.genderList{display:grid;gap:8px}.genderOption{width:100%;border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#fff;text-align:left;font-weight:700}
.chatActions{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chatActions::-webkit-scrollbar{display:none}.chatActions .tab{white-space:nowrap;flex:0 0 auto;padding:8px 12px}
.quick .tab{white-space:nowrap;flex:0 0 auto;padding:8px 12px;font-size:11px}
.savedList{display:grid;gap:8px}.savedItem{border-radius:18px;padding:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);white-space:pre-wrap;font-size:13px;line-height:1.35}
html[lang="ka"] .nav span,html[lang="hi"] .nav span,html[lang="bg"] .nav span{font-size:7.4px}
html[lang="ka"] .tab,html[lang="hi"] .tab,html[lang="bg"] .tab,html[lang="ar"] .tab,html[lang="he"] .tab{font-size:10px;padding-left:8px;padding-right:8px}
@media(max-width:390px){:root{--side:72px}.nav{width:56px}.nav span{font-size:8px}.content{padding-left:11px;padding-right:11px}.grid2{grid-template-columns:1.2fr .9fr}.card{padding:12px}.fieldGrid{gap:7px}.value{font-size:26px}.action strong{font-size:16px}.action small{font-size:10.5px}}

.mealPlanView{display:grid;gap:10px;margin-top:10px}#weekTabs{display:none!important}.weekTabs{padding:2px 0}.mealTopBar{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.mealTopTitle{font-weight:800;font-size:16px;line-height:1.15;color:var(--ink);text-shadow:0 1px 12px rgba(255,255,255,.35)}.mealTopSub{font-size:12px;color:var(--muted);margin-top:2px}.mealDay{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(5px);box-shadow:0 12px 30px rgba(0,0,0,.12);color:var(--ink);padding:12px}.mealDayHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.mealDayHead strong{font-size:16px}.mealKcal{font-size:12px;border-radius:999px;background:rgba(255,255,255,.38);padding:6px 9px;white-space:nowrap}.mealItem{border-top:1px solid rgba(39,35,30,.12);padding-top:9px;margin-top:9px}.mealItem h4{margin:0 0 5px;font-size:14px;line-height:1.2}.mealType{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--muted);margin-bottom:4px;font-weight:700}.mealControlsHidden{display:none!important}.mealTotalBottom{margin-top:12px;border-top:1px solid rgba(39,35,30,.12);padding-top:10px;font-weight:800;color:var(--ink)}.ingredients{margin:6px 0 0;padding-left:17px;font-size:12px;line-height:1.35;color:var(--muted)}.replaceBtn{margin-top:7px;border-radius:999px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.42);padding:7px 10px;color:var(--ink);font-size:11.5px}.mealTopBar .replaceBtn{margin-top:0;flex:0 0 auto}.modal .replaceBtn{color:#fff}.replaceList{display:grid;gap:8px}.replaceOption{border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px;font-size:13px;line-height:1.3}.savedItem{position:relative;padding-right:46px}.deleteSaved{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff}


.workoutPlayer.hidden,#workoutHome.hidden{display:none}.workoutTopLine{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.workoutBadge{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.38);border:1px solid var(--line);font-weight:800}.workoutHero{padding:18px}.workoutHeroHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.workoutHeroHead h2{font-size:clamp(22px,5vw,34px);line-height:1.05;margin:4px 0 0}.workoutHeroHead small{font-size:14px;opacity:.8}.workoutTimer{font-size:clamp(42px,12vw,78px);font-weight:900;line-height:.95;letter-spacing:-2px}.workoutDemo{min-height:270px;margin:16px 0;border-radius:28px;background:linear-gradient(135deg,rgba(9,20,18,.82),rgba(255,255,255,.23));border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;overflow:hidden;position:relative}.workoutVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:28px;z-index:1;background:#111}.workoutDemo.hasVideo .bodyDemo{display:none}.workoutDemo.hasVideo .demoText{z-index:2;background:rgba(255,255,255,.82)}.bodyDemo{position:relative;width:170px;height:230px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));animation:demoBounce 1.15s ease-in-out infinite}.headDemo{position:absolute;left:68px;top:6px;width:34px;height:34px;border-radius:50%;background:#e9f2e9}.torsoDemo{position:absolute;left:58px;top:48px;width:54px;height:88px;border-radius:28px 28px 20px 20px;background:#dfeade}.armDemo,.legDemo{position:absolute;background:#dfeade;border-radius:999px;transform-origin:top center}.armDemo{top:58px;width:18px;height:88px}.armLeft{left:45px;transform:rotate(24deg);animation:armLeft 1.15s ease-in-out infinite}.armRight{right:45px;transform:rotate(-24deg);animation:armRight 1.15s ease-in-out infinite}.legDemo{top:126px;width:22px;height:96px}.legLeft{left:61px;transform:rotate(10deg);animation:legLeft 1.15s ease-in-out infinite}.legRight{right:61px;transform:rotate(-10deg);animation:legRight 1.15s ease-in-out infinite}.muscleGlow{position:absolute;border-radius:999px;background:rgba(255,74,55,.78);box-shadow:0 0 22px rgba(255,74,55,.8);animation:pulseMuscle .8s ease-in-out infinite}.muscleCore{left:70px;top:80px;width:30px;height:42px}.muscleLegs{left:52px;top:142px;width:66px;height:26px}.demoText{position:absolute;left:16px;right:16px;bottom:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.72);color:#1b231f}.demoText strong{display:block;font-size:16px}.demoText small{display:block;margin-top:3px;font-size:14px}.workoutProgress{height:10px}.workoutNext{font-size:15px;margin-top:10px}.workoutControls{display:flex;gap:10px;justify-content:space-between;margin-top:10px}.workoutControls>*{flex:1}.workoutSignal{position:fixed;left:calc(var(--side) + 18px);right:18px;top:45%;z-index:100;background:rgba(255,74,84,.94);color:#fff;border-radius:28px;padding:24px;text-align:center;font-size:28px;font-weight:900;box-shadow:0 18px 40px rgba(0,0,0,.35)}@keyframes demoBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes armLeft{0%,100%{transform:rotate(26deg)}50%{transform:rotate(58deg)}}@keyframes armRight{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(-58deg)}}@keyframes legLeft{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-12deg)}}@keyframes legRight{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(12deg)}}@keyframes pulseMuscle{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
</style></head><body>
<div id="splash" class="splash"></div><div class="app"><aside class="side">
<button class="nav active" data-go="profile"><i data-icon="user"></i><span data-i18n="navProfile"></span></button><button class="nav" data-go="meal"><i data-icon="apple"></i><span data-i18n="navMeal"></span></button><button class="nav" data-go="food"><i data-icon="camera"></i><span data-i18n="navFood"></span></button><button class="nav" data-go="water"><i data-icon="drop"></i><span data-i18n="navWater"></span></button><button class="nav" data-go="workouts"><i data-icon="dumbbell"></i><span data-i18n="navWorkouts"></span></button><button class="nav" data-go="steps"><i data-icon="steps"></i><span data-i18n="navSteps"></span></button><button class="nav" data-go="coach"><i data-icon="leaf"></i><span data-i18n="navCoach"></span></button><div class="spacer"></div><button class="nav" id="openSettings"><i data-icon="settings"></i><span data-i18n="settings"></span></button></aside><main class="main">
<section id="profile" class="screen active"><div class="content"><div class="top"><div><h1 class="title" data-i18n="profileTitle"></h1><p class="sub" data-i18n="profileSub"></p></div></div><div class="grid2"><div class="card"><h3 data-i18n="myDetails"></h3><div class="fieldGrid"><div class="field"><label data-i18n="sex"></label><button id="sexButton" class="selectBtn" type="button"><span id="sexValue"></span><span class="selectArrow">⌄</span></button><input id="sex" type="hidden" value="female"></div><div class="field"><label data-i18n="age"></label><input id="age" type="number" value="38"></div><div class="field"><label data-i18n="height"></label><input id="height" type="number" value="174"></div><div class="field"><label data-i18n="weight"></label><input id="weight" type="number" value="72"></div></div></div><div class="card"><h3 data-i18n="bodyGuide"></h3><div id="bmiValue" class="value"></div><p id="bmiRange" class="note"></p><p id="wellnessTarget" class="note"></p></div></div><div class="stack"><button class="action" id="openMeasurements"><span class="bubble" data-icon="measure"></span><span><strong data-i18n="measurements"></strong><small id="measureSummary" data-i18n="measurementsSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="startPhoto"></strong><small data-i18n="startPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="endPhoto"></strong><small data-i18n="endPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="chart"></span><span><strong data-i18n="monthResult"></strong><small data-i18n="monthResultSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="meal" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="mealTitle"></h1></div></div>
<div id="dietTabsCard" class="card"><div class="segment three"><button class="tab diet active" data-diet="balanced" data-i18n="balanced"></button><button class="tab diet" data-diet="vegetarian" data-i18n="vegetarian"></button><button class="tab diet" data-diet="vegan" data-i18n="vegan"></button></div></div>
<div id="balancedModes" class="card" style="margin-top:10px"><div class="segment two"><button class="tab mealMode active" data-mode="full" data-i18n="fullMenu"></button><button class="tab mealMode" data-mode="twoMeals" data-i18n="twoMeals"></button></div></div>
<div id="weekTabs" class="quick weekTabs" style="margin-top:10px"><button class="tab weekTab active" data-week="1" data-i18n="week1"></button><button class="tab weekTab" data-week="2" data-i18n="week2"></button><button class="tab weekTab" data-week="3" data-i18n="week3"></button><button class="tab weekTab" data-week="4" data-i18n="week4"></button></div>
<div id="mealPlanView" class="mealPlanView"></div></div></section>

function localizeMenuText(text){
  if(currentLang!=='uk') return text;
  if(ukMenuExact[text]) return ukMenuExact[text];
  let out=String(text);
  ukWordPairs.forEach(([en,uk])=>{out=out.replace(new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),uk);});
  out=out.replace(/\bpcs\b/g,'шт').replace(/\bpc\b/g,'шт').replace(/\bml\b/g,'мл');
  return out;
}
function renderTopBar(backLabel,targetStep,title,sub){
  const bar=document.createElement('div');
  bar.className='mealTopBar';
  bar.innerHTML=`<button type="button" class="replaceBtn">← ${backLabel}</button><div><div class="mealTopTitle">${title||''}</div>${sub?`<div class="mealTopSub">${sub}</div>`:''}</div>`;
  bar.querySelector('button').onclick=()=>{mealStep=targetStep;renderMealPlan();};
  return bar;
}
function renderMealPlan(){
  const mealPlanEl=document.getElementById('mealPlanView');
  if(!mealPlanEl) return;
  mealPlanEl.innerHTML='';
  const oldWeekTabs=document.getElementById('weekTabs');
  if(oldWeekTabs) oldWeekTabs.style.display='none';
  updateMealControls();

  if(mealStep==='weeks'){
    [1,2,3,4].forEach(w=>{
      const card=document.createElement('div');
      card.className='mealDay';
      card.style.cursor='pointer';
      const title=t(`week${w}`);
      const sub=w===3?t('repeatWeek1'):w===4?t('repeatWeek2'):t('weekSub');
      card.innerHTML=`<div class="mealDayHead"><div><strong>${title}</strong><div class="muted" style="margin-top:4px">${sub}</div></div><span class="chev">›</span></div>`;
      card.onclick=()=>{currentWeek=w;selectedDayIndex=0;mealStep='days';updateMealControls();renderMealPlan();};
      mealPlanEl.appendChild(card);
    });
    return;
  }

  const days=getPlanDays();
  if(!days.length){
    mealPlanEl.appendChild(renderTopBar(mw('weeks'),'weeks','', ''));
    mealPlanEl.appendChild(renderMealHeader(mw('menuMissing'),''));
    return;
  }

  if(mealStep==='days'){
    mealPlanEl.appendChild(renderTopBar(mw('weeks'),'weeks',t(`week${currentWeek}`),''));
    days.forEach((day,idx)=>{
      const card=document.createElement('div');
      card.className='mealDay';
      card.style.cursor='pointer';
      card.innerHTML=`<div class="mealDayHead"><div><strong>${localizedDayName(day.name)}</strong><div class="muted" style="margin-top:4px">≈ ${day.totalKcal} ${mw('kcal')}</div></div><span class="chev">›</span></div>`;
      card.onclick=()=>{selectedDayIndex=idx;mealStep='detail';renderMealPlan();};
      mealPlanEl.appendChild(card);
    });
    return;
  }

  if(mealStep==='detail'){
    const day=days[selectedDayIndex] || days[0];
    mealPlanEl.appendChild(renderTopBar(mw('days'),'days',localizedDayName(day.name),''));
    const card=document.createElement('div');
    card.className='mealDay';
    day.meals.forEach(item=>{
      const block=document.createElement('div'); block.className='mealItem';
      const rep=(item.replaceTags||[]).length?`<button type="button" class="replaceBtn" data-tags="${item.replaceTags.join(',')}">${mw('replace')}</button>`:'';
      block.innerHTML=`<div class="mealType">${mealTypeLabel(item.type)} — ${item.kcal} ${mw('kcal')}</div><h4>${localizeMenuText(item.title)}</h4><ul class="ingredients">${item.ingredients.map(x=>`<li>${localizeMenuText(x)}</li>`).join('')}</ul>${rep}`;
      card.appendChild(block);
    });
    const total=document.createElement('div');
    total.className='mealTotalBottom';
    total.textContent=`${currentLang==='uk'?'Разом':'Total'}: ≈ ${day.totalKcal} ${mw('kcal')}`;
    card.appendChild(total);
    mealPlanEl.appendChild(card);
    mealPlanEl.querySelectorAll('.replaceBtn').forEach(btn=>{
      if(btn.dataset.tags) btn.onclick=()=>openReplace(btn.dataset.tags.split(','));
    });
  }
}
function renderMealHeader(text, sub){
  const header=document.createElement('div');
  header.className='mealDay';
  header.innerHTML=`<div class="mealDayHead"><strong>${text}</strong>${sub?`<span class="mealKcal">${sub}</span>`:''}</div>`;
  return header;
}
function openReplace(tags){
  const list=document.getElementById('replaceList');
  const title=document.getElementById('replaceTitle');
  const modal=document.getElementById('replaceModal');
  if(!list||!title||!modal) return;
  list.innerHTML='';
  title.textContent=mw('replaceOptions');
  tags.forEach(tag=>{
    const pack=mealReplaceOptions[tag]; if(!pack) return;
    const h=document.createElement('h3'); h.textContent=pack.label; list.appendChild(h);
    pack.options.forEach(opt=>{const div=document.createElement('div'); div.className='replaceOption'; div.textContent=opt; list.appendChild(div);});
  });
  modal.classList.add('open');
}

}

let currentFoodPhoto="";
let currentFoodAnalysis=null;

function readFoodPhoto(file){
  if(!file) return;
  currentFoodAnalysis=null;
  const reader=new FileReader();
  reader.onload=()=>{
    currentFoodPhoto=reader.result;
    const img=document.getElementById("foodPreview");
    const panel=document.getElementById("foodPanel");
    const note=document.getElementById("scanFoodNote");
    const result=document.getElementById("foodAiResult");
    if(img) img.src=currentFoodPhoto;
    if(panel) panel.classList.remove("hidden");
    if(note) note.textContent=t("scanFoodSoon");
    if(result) result.remove();
    showToast(t("photoReady"));
  };
  reader.readAsDataURL(file);
}

function getFoodScans(){try{return JSON.parse(localStorage.getItem("foodScans")||"[]")}catch{return []}}
function setFoodScans(items){localStorage.setItem("foodScans",JSON.stringify(items))}

function ensureFoodAiResultBox(){
  let box=document.getElementById("foodAiResult");
  if(box) return box;
  box=document.createElement("div");
  box.id="foodAiResult";
  box.className="foodAiBox";
  box.style.display="grid";
  box.style.gap="8px";
  box.style.alignItems="stretch";
  const note=document.getElementById("scanFoodNote");
  if(note && note.parentNode) note.parentNode.insertBefore(box, note.nextSibling);
  return box;
}

function renderFoodAnalysis(result){
  const box=ensureFoodAiResultBox();
  box.innerHTML="";
  const title=document.createElement("strong");
  title.textContent=t("aiResult");
  box.appendChild(title);

  const items=Array.isArray(result?.items)?result.items:[];
  if(items.length){
    items.forEach(item=>{
      const row=document.createElement("div");
      row.style.padding="8px 0";
      row.style.borderTop="1px solid rgba(255,255,255,.16)";
      const name=document.createElement("div");
      name.style.fontWeight="800";
      name.className="foodItemName";
      name.textContent=item?.name || t("foodName");
      const meta=document.createElement("div");
      meta.className="scanMeta";
      const parts=[];
      if(item?.portion) parts.push(item.portion);
      if(Number.isFinite(Number(item?.kcal))) parts.push(`≈ ${Number(item.kcal)} ${t("kcal")}`);
      if(item?.confidence) parts.push(`${t("confidence")}: ${item.confidence}`);
      meta.textContent=parts.join(" · ");
      row.appendChild(name); row.appendChild(meta); box.appendChild(row);
    });
  }

  const total=document.createElement("div");
  total.style.fontWeight="900";
  total.style.marginTop="4px";
  total.textContent=`${t("totalKcal")}: ≈ ${Number(result?.totalKcal)||0} ${t("kcal")}`;
  box.appendChild(total);

  if(result?.summary){const s=document.createElement("div");s.className="scanMeta";s.textContent=result.summary;box.appendChild(s)}
  if(result?.warning){const w=document.createElement("div");w.className="scanMeta";w.textContent=result.warning;box.appendChild(w)}
}

async function analyzeFoodPhoto(){
  if(!currentFoodPhoto){showToast(t("selectPhotoFirst"));return;}
  const btn=document.getElementById("scanFoodBtn");
  const note=document.getElementById("scanFoodNote");
  const oldText=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent=t("scanningFood");}
  if(note) note.textContent=t("scanningFoodNote");
  try{
    const response=await fetch("/api/food-scan",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({imageDataUrl:currentFoodPhoto,language:currentLang})
    });
    const data=await response.json().catch(()=>({ok:false,error:"Invalid server response"}));
    if(!response.ok || !data.ok){throw new Error(data.error||"Food scan failed");}
    currentFoodAnalysis=data.result;
    renderFoodAnalysis(currentFoodAnalysis);
    if(note) note.textContent=t("saveAiResult");
  }catch(error){
    console.error(error);
    if(note) note.textContent=`${t("scanError")} ${error.message?"("+error.message+")":""}`;
    showToast(t("scanError"));
  }finally{
    if(btn){btn.disabled=false;btn.textContent=oldText||t("scanFood");}
  }
}

function foodAnalysisName(result){
  const items=Array.isArray(result?.items)?result.items:[];
  if(items.length) return items.slice(0,3).map(x=>x?.name).filter(Boolean).join(", ") || t("foodTitle");
  return result?.summary || t("foodTitle");
}

function clearCurrentFoodScan(){
  currentFoodPhoto="";
  currentFoodAnalysis=null;
  const img=document.getElementById("foodPreview");
  if(img) img.removeAttribute("src");
  const result=document.getElementById("foodAiResult");
  if(result) result.remove();
  const note=document.getElementById("scanFoodNote");
  if(note) note.textContent=t("scanFoodSoon");
  const panel=document.getElementById("foodPanel");
  if(panel) panel.classList.add("hidden");
  const cam=document.getElementById("foodCameraInput"), gal=document.getElementById("foodGalleryInput");
  try{if(cam) cam.value=""; if(gal) gal.value="";}catch{}
}

function saveFoodScanItem(){
  const name=(document.getElementById("manualFoodName")?.value||"").trim();
  const grams=(document.getElementById("manualFoodGrams")?.value||"").trim();
  const kcal=(document.getElementById("manualFoodKcal")?.value||"").trim();
  if(!name && !kcal && !currentFoodPhoto && !currentFoodAnalysis){showToast(t("manualRequired"));return;}
  const items=getFoodScans();
  if(currentFoodAnalysis && !name && !kcal){
    items.push({date:new Date().toLocaleString(),name:foodAnalysisName(currentFoodAnalysis),grams:"",kcal:String(Number(currentFoodAnalysis.totalKcal)||""),photo:currentFoodPhoto,analysis:currentFoodAnalysis});
  }else{
    items.push({date:new Date().toLocaleString(),name:name||foodAnalysisName(currentFoodAnalysis)||t("foodTitle"),grams,kcal,photo:currentFoodPhoto,analysis:currentFoodAnalysis});
  }
  setFoodScans(items);
  if(document.getElementById("manualFoodName")) document.getElementById("manualFoodName").value="";
  if(document.getElementById("manualFoodGrams")) document.getElementById("manualFoodGrams").value="";
  if(document.getElementById("manualFoodKcal")) document.getElementById("manualFoodKcal").value="";
  showToast(t("scanSaved"));
}

function renderFoodScans(){
  const list=document.getElementById("foodScansList"); if(!list) return;
  const items=getFoodScans(); list.innerHTML="";
  if(!items.length){const empty=document.createElement("div");empty.className="replaceOption";empty.textContent=t("noFoodScans");list.appendChild(empty);return;}
  items.slice().reverse().forEach((item,i)=>{
    const originalIndex=items.length-1-i;
    const div=document.createElement("div");div.className="replaceOption scanCard";
    const imgHtml=item.photo?`<img class="scanThumb" src="${item.photo}" alt="">`:"";
    const kcalText=item.kcal?`≈ ${item.kcal} ${t("kcal")}`:"";
    let details="";
    if(item.analysis && Array.isArray(item.analysis.items)){
      details='<div class="scanMeta">'+item.analysis.items.slice(0,4).map(x=>`${x.name||""}${x.portion?" — "+x.portion:""}${x.kcal?" — ≈ "+x.kcal+" "+t("kcal"):""}`).join("<br>")+'</div>';
    }
    div.innerHTML=`${imgHtml}<strong>${item.name||t("foodTitle")}</strong><div class="scanMeta">${item.grams?item.grams+" g · ":""}${kcalText}${kcalText?" · ":""}${item.date||""}</div>${details}`;
    const del=document.createElement("button");del.className="deleteSaved";del.type="button";del.textContent="×";del.title=t("deleteScan");
    del.onclick=(e)=>{e.stopPropagation();const arr=getFoodScans();arr.splice(originalIndex,1);setFoodScans(arr);renderFoodScans();showToast(t("foodDeleted"));};
    div.appendChild(del);list.appendChild(div);
  });
}

function initFoodScan(){
  const cam=document.getElementById("foodCameraInput"), gal=document.getElementById("foodGalleryInput"), open=document.getElementById("openMyScans");
  if(cam){cam.addEventListener("click",()=>{try{cam.value=""}catch{}});cam.addEventListener("change",()=>readFoodPhoto(cam.files&&cam.files[0]));}
  if(gal){gal.addEventListener("click",()=>{try{gal.value=""}catch{}});gal.addEventListener("change",()=>readFoodPhoto(gal.files&&gal.files[0]));}
  const scanBtn=document.getElementById("scanFoodBtn"); if(scanBtn) scanBtn.onclick=analyzeFoodPhoto;
  const clearBtn=document.getElementById("clearCurrentScan"); if(clearBtn) clearBtn.onclick=clearCurrentFoodScan;
  const saveBtn=document.getElementById("saveFoodScan"); if(saveBtn) saveBtn.onclick=saveFoodScanItem;
  if(open) open.onclick=()=>{renderFoodScans();document.getElementById("foodScansModal")?.classList.add("open")};
}


let workoutLevel="beginner",workoutKind="cardio",workoutIndex=0,workoutRemaining=0,workoutTimerId=null,workoutPaused=false,musicTimer=null,audioCtx=null;
const workoutPlans={
  cardio:{nameKey:"beginnerCardio",items:[{key:"marchPlace",muscles:"cardioBody",duration:180,kcal:18},{key:"armCircles",muscles:"armsShoulders",duration:120,kcal:10,video:"assets/workouts/cardio/shoulder-elbow-circles-warmup.mp4"},{key:"stepTouch",muscles:"cardioBody",duration:180,kcal:20},{key:"lightSquats",muscles:"legsGlutes",duration:180,kcal:24},{key:"coolStretch",muscles:"backSpine",duration:240,kcal:12}]},
  strength:{nameKey:"beginnerStrength",items:[{key:"bodySquat",muscles:"legsGlutes",duration:180,kcal:25},{key:"wallPushups",muscles:"chestArms",duration:150,kcal:18},{key:"gluteBridge",muscles:"hipsBack",duration:180,kcal:22},{key:"birdDog",muscles:"coreBack",duration:180,kcal:16},{key:"coolStretch",muscles:"backSpine",duration:210,kcal:10}]},
  yoga:{nameKey:"beginnerYoga",items:[{key:"catCow",muscles:"backSpine",duration:150,kcal:8},{key:"childPose",muscles:"hipsBack",duration:150,kcal:6},{key:"hamstringStretch",muscles:"hamstrings",duration:180,kcal:8},{key:"neckShoulders",muscles:"neckShoulderMuscles",duration:120,kcal:5},{key:"coolStretch",muscles:"backSpine",duration:120,kcal:6}]}
};
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function beep(freq=880,dur=.18){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.value=.08;o.connect(g);g.connect(audioCtx.destination);o.start();setTimeout(()=>{try{o.stop()}catch{}},dur*1000)}catch{}}
function startMusic(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();stopMusic();musicTimer=setInterval(()=>{beep(220,.045)},620);const b=document.getElementById("toggleMusic");if(b)b.textContent=t("musicOn")}catch{}}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}const b=document.getElementById("toggleMusic");if(b)b.textContent=t("musicOff")}
function currentWorkout(){return workoutPlans[workoutKind]||workoutPlans.cardio}
function renderWorkoutPlayer(){const plan=currentWorkout(),item=plan.items[workoutIndex],next=plan.items[workoutIndex+1];const count=document.getElementById("workoutCount"),planName=document.getElementById("workoutPlanName"),name=document.getElementById("workoutExerciseName"),timer=document.getElementById("workoutTimer"),muscles=document.getElementById("workoutMuscles"),nextName=document.getElementById("workoutNextName"),fill=document.getElementById("workoutProgressFill"),demoBox=document.getElementById("workoutDemoBox"),video=document.getElementById("workoutVideo");if(count)count.textContent=`${workoutIndex+1} / ${plan.items.length}`;if(planName)planName.textContent=t(plan.nameKey);if(name)name.textContent=t(item.key);if(timer)timer.textContent=fmtTime(workoutRemaining);if(muscles)muscles.textContent=`${t("muscles")}: ${t(item.muscles)} · ≈ ${item.kcal} ${t("kcal")}`;if(nextName)nextName.textContent=next?t(next.key):t("workoutFinished");if(fill)fill.style.width=Math.min(100,((item.duration-workoutRemaining)/item.duration)*100)+"%";if(video&&demoBox){if(item.video){if(!video.src.endsWith(item.video))video.src=item.video;video.classList.remove("hidden");demoBox.classList.add("hasVideo");if(workoutPaused)video.pause();else video.play().catch(()=>{})}else{video.pause();video.removeAttribute("src");video.load();video.classList.add("hidden");demoBox.classList.remove("hasVideo")}}const pause=document.getElementById("pauseWorkout");if(pause)pause.textContent=workoutPaused?t("resume"):t("pause")}
function showWorkoutSignal(text){const el=document.getElementById("workoutSignal");if(!el)return;el.textContent=text;el.classList.remove("hidden");setTimeout(()=>el.classList.add("hidden"),1100)}
function workoutTick(){if(workoutPaused)return;workoutRemaining--;renderWorkoutPlayer();if(workoutRemaining<=0){beep(980,.22);setTimeout(()=>beep(1180,.18),240);try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch{};nextWorkoutExercise(true)}}
function runWorkoutTimer(){clearInterval(workoutTimerId);workoutTimerId=setInterval(workoutTick,1000)}
function startWorkout(kind){workoutKind=kind;workoutIndex=0;workoutPaused=false;const plan=currentWorkout();workoutRemaining=plan.items[0].duration;document.getElementById("workoutHome")?.classList.add("hidden");document.getElementById("workoutPlayer")?.classList.remove("hidden");renderWorkoutPlayer();runWorkoutTimer();showWorkoutSignal(t(plan.nameKey));beep(660,.12)}
function closeWorkout(){clearInterval(workoutTimerId);workoutTimerId=null;stopMusic();const video=document.getElementById("workoutVideo");if(video)video.pause();document.getElementById("workoutPlayer")?.classList.add("hidden");document.getElementById("workoutHome")?.classList.remove("hidden")}
function nextWorkoutExercise(auto=false){const plan=currentWorkout();if(workoutIndex<plan.items.length-1){workoutIndex++;workoutRemaining=plan.items[workoutIndex].duration;workoutPaused=false;renderWorkoutPlayer();showWorkoutSignal(t("nextExerciseSignal"));runWorkoutTimer()}else{clearInterval(workoutTimerId);workoutTimerId=null;workoutPaused=true;renderWorkoutPlayer();showWorkoutSignal(t("workoutFinished"));stopMusic()}}
function prevWorkoutExercise(){const plan=currentWorkout();if(workoutIndex>0){workoutIndex--;workoutRemaining=plan.items[workoutIndex].duration;workoutPaused=false;renderWorkoutPlayer();runWorkoutTimer()}}
function initWorkoutPlayer(){document.querySelectorAll("#workoutLevelTabs .tab").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("#workoutLevelTabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");workoutLevel=btn.dataset.level||"beginner"});document.querySelectorAll(".workoutStart").forEach(btn=>btn.onclick=()=>startWorkout(btn.dataset.workout||"cardio"));document.getElementById("closeWorkoutPlayer")?.addEventListener("click",closeWorkout);document.getElementById("nextExerciseBtn")?.addEventListener("click",()=>nextWorkoutExercise(false));document.getElementById("prevExercise")?.addEventListener("click",prevWorkoutExercise);document.getElementById("restartWorkout")?.addEventListener("click",()=>startWorkout(workoutKind));document.getElementById("pauseWorkout")?.addEventListener("click",()=>{workoutPaused=!workoutPaused;renderWorkoutPlayer()});document.getElementById("toggleMusic")?.addEventListener("click",()=>{if(musicTimer)stopMusic();else startMusic()})}

window.onload=()=>{applyTranslations();initFoodScan();initWorkoutPlayer();updateMealControls();renderMealPlan();setTimeout(()=>splash.classList.add("hide"),850)};
