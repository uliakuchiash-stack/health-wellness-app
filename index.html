

<!doctype html>

<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071014;color:#fff;overflow:hidden}button,input,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden;background:#071014}.splash{position:fixed;inset:0;z-index:100;background:#dfe9e2 url("assets/backgrounds/splash-screen-ocean.png") center/cover no-repeat;transition:.45s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.side{z-index:5;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(2,8,11,.82);backdrop-filter:blur(16px)}.nav{width:60px;min-height:56px;border-radius:18px;display:grid;place-items:center;gap:3px;padding:7px 2px;color:rgba(255,255,255,.78)}.nav.active{background:linear-gradient(135deg,#ff6470,#ff3d4b);color:#fff;box-shadow:0 12px 24px rgba(255,61,75,.25)}.nav svg{width:24px;height:24px;stroke-width:1.85}.nav span{font-size:8.6px;line-height:1.05;text-align:center;max-width:60px;word-break:break-word}.spacer{flex:1}
.main{position:relative;overflow:hidden}.screen{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transition:.2s;transform:translateX(8px)}.screen.active{opacity:1;pointer-events:auto;transform:none}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.03) 48%,rgba(0,0,0,.12))}
#profile{background-image:url("assets/backgrounds/profile-bg.png")}#meal{background-image:url("assets/backgrounds/menu-bg.png")}#food{background-image:url("assets/backgrounds/food-scan-bg.png")}#water{background-image:url("assets/backgrounds/water-bg.png")}#workouts{background-image:url("assets/backgrounds/workouts-bg.png")}#steps{background-image:url("assets/backgrounds/steps-bg.png")}#coach{background-image:url("assets/backgrounds/coach-bg.png")}
.content{position:relative;z-index:1;height:100%;overflow:auto;padding:14px 14px 22px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{text-align:center;min-height:52px;margin-bottom:8px;display:grid;place-items:center}.title{font-size:clamp(22px,6.5vw,30px);letter-spacing:.04em;line-height:1.04;margin:0;text-shadow:0 3px 16px rgba(0,0,0,.45)}.sub{font-size:12px;margin:4px 0 0;color:rgba(255,255,255,.82);text-shadow:0 2px 10px rgba(0,0,0,.35)}
.card,.action{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(5px);box-shadow:0 12px 30px rgba(0,0,0,.12);color:var(--ink)}.card{padding:13px}.grid2{display:grid;grid-template-columns:1.22fr .95fr;gap:10px;margin-bottom:10px}h3{font-size:16px;line-height:1.1;margin:0 0 10px}.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}label{font-size:11.5px;color:var(--muted)}input,select{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(39,35,30,.15);background:rgba(255,255,255,.3);color:var(--ink);outline:none;padding:9px 10px}select{padding-right:26px;font-size:13px}option{color:#111;background:#fff}.value{font-size:28px;font-weight:800;line-height:1.06}.note{font-size:11.5px;line-height:1.35;color:var(--muted);margin:7px 0 0}
.stack{display:grid;gap:10px}.action{min-height:74px;padding:10px;display:grid;grid-template-columns:48px 1fr 16px;align-items:center;gap:10px;text-align:left}.bubble{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.25)}.bubble svg{width:25px;height:25px}.action strong{font-size:17px;line-height:1.08}.action small{display:block;font-size:11.2px;line-height:1.25;color:var(--muted);margin-top:3px}.chev svg{width:17px;height:17px}
.segment{display:grid;gap:7px}.segment.three{grid-template-columns:repeat(3,1fr)}.segment.two{grid-template-columns:repeat(2,1fr)}.tab{padding:9px 4px;border-radius:999px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.35);color:var(--ink);font-size:11px;text-align:center;min-width:0}.tab.active{background:rgba(255,255,255,.62)}.hidden{display:none!important}.info{font-size:13px;text-align:center;line-height:1.35}.progress{height:8px;border-radius:999px;background:rgba(39,35,30,.18);overflow:hidden}.fill{height:100%;border-radius:999px;background:#58b9ff}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{border-radius:999px;background:rgba(255,255,255,.36);border:1px solid rgba(255,255,255,.4);padding:8px 12px;color:var(--ink);font-size:12px}.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.glass{aspect-ratio:1/.75;border-radius:17px;background:rgba(255,255,255,.24);border:1px solid rgba(39,35,30,.16);color:var(--ink)}.glass.done{background:rgba(88,185,255,.78);color:#fff}
.chat{display:grid;gap:10px;padding-bottom:70px}.msg{max-width:86%;padding:12px 13px;border-radius:19px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.32);color:var(--ink);font-size:13px;line-height:1.36;backdrop-filter:blur(5px)}.user{justify-self:end}.ai{justify-self:start}.quick{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.chatbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 46px;gap:8px;padding-top:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.15))}.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#25352d;display:grid;place-items:center}
.modalWrap{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);padding:12px}.modalWrap.open{display:flex}.modal{width:min(100%,620px);max-height:86vh;overflow:auto;border-radius:26px;background:rgba(18,25,26,.9);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);padding:14px;color:#fff}.modal .card,.modal .action{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}.modal label,.modal .note,.modal small{color:rgba(255,255,255,.74)}.modal input,.modal select{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modalHead h2{margin:0;font-size:23px}.closeBtn{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#fff}.measureGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.saveBtn{width:100%;border-radius:18px;background:linear-gradient(135deg,#ff6470,#ff3d4b);padding:13px;color:#fff;font-weight:700;margin-top:10px}
.selectBtn{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(39,35,30,.15);background:rgba(255,255,255,.3);color:var(--ink);outline:none;padding:9px 10px;display:flex;align-items:center;justify-content:space-between}
.selectBtn span:first-child{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selectArrow{opacity:.75;font-size:13px}
.genderList{display:grid;gap:8px}.genderOption{width:100%;border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#fff;text-align:left;font-weight:700}
.chatActions{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chatActions::-webkit-scrollbar{display:none}.chatActions .tab{white-space:nowrap;flex:0 0 auto;padding:8px 12px}
.quick .tab{white-space:nowrap;flex:0 0 auto;padding:8px 12px;font-size:11px}
.savedList{display:grid;gap:8px}.savedItem{border-radius:18px;padding:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);white-space:pre-wrap;font-size:13px;line-height:1.35}
html[lang="ka"] .nav span,html[lang="hi"] .nav span,html[lang="bg"] .nav span{font-size:7.4px}
html[lang="ka"] .tab,html[lang="hi"] .tab,html[lang="bg"] .tab,html[lang="ar"] .tab,html[lang="he"] .tab{font-size:10px;padding-left:8px;padding-right:8px}
@media(max-width:390px){:root{--side:72px}.nav{width:56px}.nav span{font-size:8px}.content{padding-left:11px;padding-right:11px}.grid2{grid-template-columns:1.2fr .9fr}.card{padding:12px}.fieldGrid{gap:7px}.value{font-size:26px}.action strong{font-size:16px}.action small{font-size:10.5px}}

.mealPlanView{display:grid;gap:9px;margin-top:4px}#weekTabs{display:none!important}.weekTabs{padding:2px 0}.mealTopBar{display:flex;align-items:center;gap:10px;margin:0 0 6px}.mealTopTitle{font-weight:800;font-size:16px;line-height:1.15;color:var(--ink);text-shadow:0 1px 12px rgba(255,255,255,.35)}.mealTopSub{font-size:12px;color:var(--muted);margin-top:2px}.mealDay{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(5px);box-shadow:0 12px 30px rgba(0,0,0,.12);color:var(--ink);padding:12px}.mealDayHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.mealDayHead strong{font-size:16px}.mealKcal{font-size:12px;border-radius:999px;background:rgba(255,255,255,.38);padding:6px 9px;white-space:nowrap}.mealItem{border-top:1px solid rgba(39,35,30,.12);padding-top:9px;margin-top:9px}.mealItem h4{margin:0 0 5px;font-size:14px;line-height:1.2}.mealType{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--muted);margin-bottom:4px;font-weight:700}.mealControlsHidden{display:none!important}.mealTotalBottom{margin-top:12px;border-top:1px solid rgba(39,35,30,.12);padding-top:10px;font-weight:800;color:var(--ink)}.ingredients{margin:6px 0 0;padding-left:17px;font-size:12px;line-height:1.35;color:var(--muted)}.replaceBtn{margin-top:7px;border-radius:999px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.42);padding:7px 10px;color:var(--ink);font-size:11.5px}.mealTopBar .replaceBtn{margin-top:0;flex:0 0 auto}.modal .replaceBtn{color:#fff}.replaceList{display:grid;gap:8px}.replaceOption{border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:10px;font-size:13px;line-height:1.3}.savedItem{position:relative;padding-right:46px}.deleteSaved{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff}


#meal.meal-open .top{display:none!important}
#meal.meal-open .content{padding-top:8px}
#meal.meal-open #mealPlanView{margin-top:0}
#meal.meal-detail .mealTopBar{margin-top:0;margin-bottom:6px}
#meal.meal-detail .mealDay{padding-top:4px}
.mealDay .mealItem:first-child{border-top:0;margin-top:0;padding-top:2px}
.replacementMealCard{display:grid;gap:8px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:12px;color:#fff}.replacementMealType{font-size:13px;font-weight:800;opacity:.88}.replacementMealTitle{font-size:18px;font-weight:850;line-height:1.2}.replacementMealKcal{font-size:12px;opacity:.78}.replacementIngredients{margin:2px 0 0;padding-left:18px;font-size:13px;line-height:1.35;color:rgba(255,255,255,.78)}
</style></head><body>
<div id="splash" class="splash"></div><div class="app"><aside class="side">
<button class="nav active" data-go="profile"><i data-icon="user"></i><span data-i18n="navProfile"></span></button><button class="nav" data-go="meal"><i data-icon="apple"></i><span data-i18n="navMeal"></span></button><button class="nav" data-go="food"><i data-icon="camera"></i><span data-i18n="navFood"></span></button><button class="nav" data-go="water"><i data-icon="drop"></i><span data-i18n="navWater"></span></button><button class="nav" data-go="workouts"><i data-icon="dumbbell"></i><span data-i18n="navWorkouts"></span></button><button class="nav" data-go="steps"><i data-icon="steps"></i><span data-i18n="navSteps"></span></button><button class="nav" data-go="coach"><i data-icon="leaf"></i><span data-i18n="navCoach"></span></button><div class="spacer"></div><button class="nav" id="openSettings"><i data-icon="settings"></i><span data-i18n="settings"></span></button></aside><main class="main">
<section id="profile" class="screen active"><div class="content"><div class="top"><div><h1 class="title" data-i18n="profileTitle"></h1><p class="sub" data-i18n="profileSub"></p></div></div><div class="grid2"><div class="card"><h3 data-i18n="myDetails"></h3><div class="fieldGrid"><div class="field"><label data-i18n="sex"></label><button id="sexButton" class="selectBtn" type="button"><span id="sexValue"></span><span class="selectArrow">⌄</span></button><input id="sex" type="hidden" value="female"></div><div class="field"><label data-i18n="age"></label><input id="age" type="number" value="38"></div><div class="field"><label data-i18n="height"></label><input id="height" type="number" value="174"></div><div class="field"><label data-i18n="weight"></label><input id="weight" type="number" value="72"></div></div></div><div class="card"><h3 data-i18n="bodyGuide"></h3><div id="bmiValue" class="value"></div><p id="bmiRange" class="note"></p><p id="wellnessTarget" class="note"></p></div></div><div class="stack"><button class="action" id="openMeasurements"><span class="bubble" data-icon="measure"></span><span><strong data-i18n="measurements"></strong><small id="measureSummary" data-i18n="measurementsSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="startPhoto"></strong><small data-i18n="startPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="endPhoto"></strong><small data-i18n="endPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="chart"></span><span><strong data-i18n="monthResult"></strong><small data-i18n="monthResultSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="meal" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="mealTitle"></h1></div></div>
<div id="dietTabsCard" class="card"><div class="segment three"><button class="tab diet active" data-diet="balanced" data-i18n="balanced"></button><button class="tab diet" data-diet="vegetarian" data-i18n="vegetarian"></button><button class="tab diet" data-diet="vegan" data-i18n="vegan"></button></div></div>

function safeReplace(out,en,val){
  const esc=String(en).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const isWord=/^[A-Za-z][A-Za-z\s-]*[A-Za-z]$/.test(String(en));
  const re=isWord?new RegExp('(?<![A-Za-z])'+esc+'(?![A-Za-z])','gi'):new RegExp(esc,'gi');
  return String(out).replace(re,val);
}

function localizeMenuText(text){
  if(!text) return '';
  if(currentLang==='en') return String(text);

  // ingredient words after later menu edits, so we must still run the word patch.
  let out=(currentLang==='uk' && ukMenuExact[text]) ? ukMenuExact[text] : String(text);
  mergedMealPairs().forEach(([en,tr])=>{out=safeReplace(out,en,tr);});
  out=out.replace(/\s+\/\s+/g,'/').replace(/\s+\+\s+/g,' + ');
  if(currentLang==='uk') out=out
    .replace(/\bpcs\b/g,'шт').replace(/\bpc\b/g,'шт').replace(/\bml\b/g,'мл')
    .replace(/\bg\b/g,'г').replace(/\bG\b/g,'г')

    .replace(/\bcrispbread\b/gi,'хлібці').replace(/\boat flour\b/gi,'вівсяне борошно')
    .replace(/\bpeanut butter\b/gi,'арахісова паста');
  return out;
}

function inferReplaceTags(item){
  const raw=((item.title||'')+' '+(item.ingredients||[]).join(' ')).toLowerCase();
  const tags=[];
  const add=t=>{if(!tags.includes(t)) tags.push(t);};
  add('generic');
  if(/nut|almond|walnut|peanut/.test(raw)) add('nuts');
  if(/honey/.test(raw)) add('honey');
  if(/hummus/.test(raw)) add('hummus');
  if(/bean|chickpea|lentil/.test(raw)) add('legumes');
  if(/tofu|tempeh/.test(raw)) add('tofu');
  if(/yoghurt|kefir|cottage cheese|cheese|cream|milk/.test(raw)) add('dairy');
  if(/fish|tuna|salmon/.test(raw)) add('fish');
  if(/chicken|turkey|beef|rabbit/.test(raw)) add('meat');
  if(/oat|rice|buckwheat|bulgur|pasta|bread|toast|potato|granola|crispbread/.test(raw)) add('grains');
  if(/oil|dressing/.test(raw)) add('oil');
  if(/fruit|apple|banana|pear|berries|kiwi|peach|orange/.test(raw)) add('fruit');
  if(/egg/.test(raw)) add('egg');
  return tags.slice(0,4);
}

function localizeReplaceText(text){
  if(currentLang==='uk' && replaceExactUk[text]) return replaceExactUk[text];
  if(currentLang==='uk' && replaceExtraUk[text]) return replaceExtraUk[text];
  return localizeMenuText(text);
}
function renderTopBar(backLabel,targetStep){
  const bar=document.createElement('div');
  bar.className='mealTopBar';
  bar.innerHTML=`<button type="button" class="replaceBtn">← ${backLabel}</button>`;
  bar.querySelector('button').onclick=()=>{mealStep=targetStep;renderMealPlan();};
  return bar;
}
function renderMealPlan(){
  const mealPlanEl=document.getElementById('mealPlanView');
  if(!mealPlanEl) return;
  mealPlanEl.innerHTML='';
  const oldWeekTabs=document.getElementById('weekTabs');
  if(oldWeekTabs) oldWeekTabs.style.display='none';
  updateMealControls();

  if(mealStep==='weeks'){
    [1,2,3,4].forEach(w=>{
      const card=document.createElement('div');
      card.className='mealDay';
      card.style.cursor='pointer';
      const title=t(`week${w}`);
      const sub=w===3?t('repeatWeek1'):w===4?t('repeatWeek2'):t('weekSub');
      card.innerHTML=`<div class="mealDayHead"><div><strong>${title}</strong><div class="muted" style="margin-top:4px">${sub}</div></div><span class="chev">›</span></div>`;
      card.onclick=()=>{currentWeek=w;selectedDayIndex=0;mealStep='days';updateMealControls();renderMealPlan();};
      mealPlanEl.appendChild(card);
    });
    return;
  }

  const days=getPlanDays();
  if(!days.length){
    mealPlanEl.appendChild(renderTopBar(currentLang==='uk'?'Тижні':cap(mw('weeks')),'weeks'));
    mealPlanEl.appendChild(renderMealHeader(mw('menuMissing'),''));
    return;
  }

  if(mealStep==='days'){
    mealPlanEl.appendChild(renderTopBar(currentLang==='uk'?'Тижні':cap(mw('weeks')),'weeks'));
    days.forEach((day,idx)=>{
      const card=document.createElement('div');
      card.className='mealDay';
      card.style.cursor='pointer';
      card.innerHTML=`<div class="mealDayHead"><div><strong>${localizedDayName(day.name)}</strong><div class="muted" style="margin-top:4px">≈ ${day.totalKcal} ${mw('kcal')}</div></div><span class="chev">›</span></div>`;
      card.onclick=()=>{selectedDayIndex=idx;mealStep='detail';renderMealPlan();};
      mealPlanEl.appendChild(card);
    });
    return;
  }

  if(mealStep==='detail'){
    const day=days[selectedDayIndex] || days[0];
    mealPlanEl.appendChild(renderTopBar(currentLang==='uk'?'Дні':cap(mw('days')),'days'));
    const card=document.createElement('div');
    card.className='mealDay';
    day.meals.forEach((item,mealIdx)=>{
      const block=document.createElement('div'); block.className='mealItem';
      const rep=`<button type="button" class="replaceBtn" data-day-index="${selectedDayIndex}" data-meal-index="${mealIdx}">${mw('replace')}</button>`;
      block.innerHTML=`<div class="mealType">${mealTypeLabel(item.type)} — ${item.kcal} ${mw('kcal')}</div><h4>${localizeMenuText(item.title)}</h4><ul class="ingredients">${item.ingredients.map(x=>`<li>${localizeMenuText(x)}</li>`).join('')}</ul>${rep}`;
      card.appendChild(block);
    });
    const total=document.createElement('div');
    total.className='mealTotalBottom';
    total.textContent=`${currentLang==='uk'?'Разом':(currentLang==='ja'?'合計':(currentLang==='pl'?'Razem':'Total'))}: ≈ ${day.totalKcal} ${mw('kcal')}`;
    card.appendChild(total);
    mealPlanEl.appendChild(card);
    mealPlanEl.querySelectorAll('.replaceBtn[data-meal-index]').forEach(btn=>{
      btn.onclick=()=>openReplace(+btn.dataset.dayIndex,+btn.dataset.mealIndex);
    });
  }
}
function renderMealHeader(text, sub){
  const header=document.createElement('div');
  header.className='mealDay';
  header.innerHTML=`<div class="mealDayHead"><strong>${text}</strong>${sub?`<span class="mealKcal">${sub}</span>`:''}</div>`;
  return header;
}

  if(currentLang==='uk') return 'Заміна страви';

function replacementGroup(type){
  const t=String(type||'');
  if(t.startsWith('snack')) return 'snack';
  if(t==='meal1') return 'meal1';
  if(t==='meal2') return 'meal2';
  if(t==='lightOption') return 'lightOption';
  if(t==='breakfast'||t==='lunch'||t==='dinner') return t;
  return 'snack';
}
function chooseReplacementMeal(dayIndex,mealIndex){
  const days=getPlanDays();
  const currentDay=days[dayIndex]||days[0];
  const current=currentDay?.meals?.[mealIndex];
  const group=replacementGroup(current?.type);
  const list=replacementMeals[group]||replacementMeals.snack;
  return list[(dayIndex+mealIndex)%list.length];
}
function renderReplacementMeal(meal){
  const card=document.createElement('div');
  card.className='replacementMealCard';
  if(!meal){
    card.textContent=currentLang==='uk'?'Заміна для цієї страви поки недоступна.':'Replacement is not available for this meal yet.';
    return card;
  }
  const ul=(meal.ingredients||[]).map(x=>`<li>${localizeMenuText(x)}</li>`).join('');
  card.innerHTML=`<div class="replacementMealType">${mealTypeLabel(meal.type)} — ${meal.kcal} ${mw('kcal')}</div><div class="replacementMealTitle">${localizeMenuText(meal.title)}</div><ul class="replacementIngredients">${ul}</ul>`;
  return card;
}
function openReplace(dayIndex,mealIndex){
  const list=document.getElementById('replaceList');
  const title=document.getElementById('replaceTitle');
  const modal=document.getElementById('replaceModal');
  if(!list||!title||!modal) return;
  list.innerHTML='';
  title.textContent=replacementModalTitle();
  list.appendChild(renderReplacementMeal(chooseReplacementMeal(dayIndex,mealIndex)));
  modal.classList.add('open');
}
function updateMealControls(){
  const balancedModesEl=document.getElementById('balancedModes');
  const dietTabsCard=document.getElementById('dietTabsCard');
  const mealScreen=document.getElementById('meal');
  const insideOpenMeal=mealStep!=='weeks';
  if(mealScreen){mealScreen.classList.toggle('meal-open',insideOpenMeal);mealScreen.classList.toggle('meal-detail',mealStep==='detail');}
  if(dietTabsCard) dietTabsCard.classList.toggle('mealControlsHidden', insideOpenMeal);
  if(balancedModesEl) balancedModesEl.classList.toggle('hidden',currentDiet!=='balanced' || insideOpenMeal);
  document.querySelectorAll('.diet').forEach(x=>x.classList.toggle('active',x.dataset.diet===currentDiet));
  document.querySelectorAll('.mealMode').forEach(x=>x.classList.toggle('active',x.dataset.mode===currentMealMode));
  document.querySelectorAll('.weekTab').forEach(x=>x.classList.toggle('active',+x.dataset.week===currentWeek));
}
document.querySelectorAll('.diet').forEach(b=>b.addEventListener('click',()=>{
  currentDiet=b.dataset.diet;
  currentMealMode='full';
  currentWeek=1;
  selectedDayIndex=0;
  mealStep='weeks';
  updateMealControls();
  renderMealPlan();
}));
document.querySelectorAll('.mealMode').forEach(b=>b.addEventListener('click',()=>{
  currentMealMode=b.dataset.mode;
  currentWeek=1;
  selectedDayIndex=0;
  mealStep='weeks';
  updateMealControls();
  renderMealPlan();
}));
document.querySelectorAll('.weekTab').forEach(b=>b.addEventListener('click',()=>{
  currentWeek=+b.dataset.week;
  selectedDayIndex=0;
  mealStep='days';
  updateMealControls();
  renderMealPlan();
}));

function updateBMI(){const h=+height.value/100,w=+weight.value;if(!h||!w)return;const bmi=w/(h*h),min=18.5*h*h,max=24.9*h*h,tm=(sex.value==="female"?19.5:20.5)*h*h,tx=(sex.value==="female"?21.3:22.5)*h*h;bmiValue.textContent=`BMI: ${bmi.toFixed(1)}`;bmiRange.textContent=`${t("bmiRange")}: ${min.toFixed(0)}–${max.toFixed(0)} kg`;wellnessTarget.textContent=`${t("wellnessTarget")}: ${tm.toFixed(0)}–${tx.toFixed(0)} kg`;}
["sex","age","height","weight"].forEach(id=>["input","change","keyup","blur"].forEach(ev=>document.getElementById(id).addEventListener(ev,updateBMI)));
function loadM(){try{return JSON.parse(localStorage.getItem("bodyMeasurements")||"{}")}catch{return {}}}function updateMeasurementsSummary(){const m=loadM();[["mChest","chest"],["mWaist","waist"],["mBelly","belly"],["mHips","hips"],["mArm","arm"],["mThigh","thigh"]].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.value=m[k]||""});const vals=[m.chest,m.waist,m.belly,m.hips,m.arm,m.thigh].filter(Boolean);measureSummary.textContent=vals.length?`${vals.join(" / ")} ${t("cm")}`:t("measurementsSub")}saveMeasurements.onclick=()=>{const m={chest:mChest.value,waist:mWaist.value,belly:mBelly.value,hips:mHips.value,arm:mArm.value,thigh:mThigh.value};localStorage.setItem("bodyMeasurements",JSON.stringify(m));updateMeasurementsSummary();measureModal.classList.remove("open")};
let water=+localStorage.getItem("waterMl")||0,goal=2000;function updateWater(){if(!glasses)return;glasses.innerHTML="";const done=Math.floor(water/250);for(let i=1;i<=8;i++){const b=document.createElement("button");b.className="glass"+(i<=done?" done":"");b.textContent=i;b.onclick=()=>{water=i*250;localStorage.setItem("waterMl",water);updateWater()};glasses.appendChild(b)}waterNow.textContent=(water/1000).toFixed(water%1000?2:0);waterFill.style.width=Math.min(100,water/goal*100)+"%";waterLeft.textContent=done>=8?t("goalDone"):`${8-done} ${t("glassesLeft")}`}document.querySelectorAll(".addWater").forEach(b=>b.onclick=()=>{water=Math.min(goal,water+(+b.dataset.ml));localStorage.setItem("waterMl",water);updateWater()});resetWater.onclick=()=>{water=0;localStorage.setItem("waterMl",0);updateWater()};
function addMsg(text,who){const m=document.createElement("div");m.className="msg "+who+" dynamicMsg";m.textContent=text;chat.insertBefore(m,chat.querySelector(".chatActions"));m.scrollIntoView({behavior:"smooth"})}
function resetDefaultChat(){document.querySelectorAll(".dynamicMsg").forEach(m=>m.remove())}
function getChatText(){return [...chat.querySelectorAll(".msg")].map(m=>m.textContent.trim()).filter(Boolean).join("\n\n")}
function getSavedChats(){try{return JSON.parse(localStorage.getItem("savedChats")||"[]")}catch{return []}}
function setSavedChats(items){localStorage.setItem("savedChats",JSON.stringify(items))}
function renderSavedChats(){const items=getSavedChats();savedList.innerHTML="";if(!items.length){const empty=document.createElement("div");empty.className="savedItem";empty.textContent=t("noSavedChats");savedList.appendChild(empty);return}items.slice().reverse().forEach((item,i)=>{const originalIndex=items.length-1-i;const div=document.createElement("div");div.className="savedItem";div.textContent=item.date+"\n\n"+item.text;const del=document.createElement("button");del.className="deleteSaved";del.textContent="×";del.onclick=(e)=>{e.stopPropagation();const arr=getSavedChats();arr.splice(originalIndex,1);setSavedChats(arr);renderSavedChats()};div.appendChild(del);savedList.appendChild(div)})}
document.querySelectorAll(".quickBtn").forEach(b=>b.onclick=()=>{addMsg(b.textContent,"user");const key={motivation:"replyMotivation",tired:"replyTired",broke:"replyBroke",pain:"replyPain"}[b.dataset.reply];setTimeout(()=>addMsg(t(key),"ai"),160)});
sendCoach.onclick=()=>{if(!coachInput.value.trim())return;addMsg(coachInput.value,"user");coachInput.value="";setTimeout(()=>addMsg(t("replyMotivation"),"ai"),160)};
coachInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendCoach.click()});
clearChat.onclick=()=>resetDefaultChat();
saveChat.onclick=()=>{const items=getSavedChats();items.push({date:new Date().toLocaleString(),text:getChatText()});setSavedChats(items);addMsg(t("chatSaved"),"ai")};
viewSaved.onclick=()=>{renderSavedChats();savedModal.classList.add("open")};
window.onload=()=>{applyTranslations();updateMealControls();renderMealPlan();setTimeout(()=>splash.classList.add("hide"),850)};
