
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Wellness App</title>
<meta name="theme-color" content="#071014" />
<style>
:root{--side:78px;--red:#ff4a55;--text:#fff;--glass:rgba(34,34,28,.34);--glassLight:rgba(255,255,255,.30);--border:rgba(255,255,255,.28);--dark:#24211c;--muted:rgba(255,255,255,.78);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#071014;color:var(--text)}body{overflow:hidden}button,input,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden;background:#071014}.splash{position:fixed;inset:0;z-index:100;background:#dfeadb url("assets/backgrounds/splash-screen-ocean.png") center/cover no-repeat;transition:.45s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.side{z-index:5;background:rgba(2,8,11,.82);backdrop-filter:blur(14px);padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:8px 0 24px rgba(0,0,0,.28)}.nav{width:60px;min-height:55px;border-radius:18px;display:grid;place-items:center;gap:3px;padding:7px 2px;color:rgba(255,255,255,.76)}.nav.active{background:linear-gradient(135deg,#ff646a,#ff3f49);color:#fff;box-shadow:0 10px 24px rgba(255,63,73,.25)}.nav svg{width:23px;height:23px;stroke-width:1.8}.nav span{font-size:8.3px;line-height:1.05;text-align:center;max-width:58px}.spacer{flex:1}.main{position:relative;overflow:hidden}.screen{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transform:translateX(10px);transition:.22s}.screen.active{opacity:1;pointer-events:auto;transform:none}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.03) 45%,rgba(0,0,0,.13))}#profile{background-image:url("assets/backgrounds/profile-bg.png"),linear-gradient(#665,#332)}#menu{background-image:url("assets/backgrounds/menu-bg.png"),linear-gradient(#354,#221)}#food{background-image:url("assets/backgrounds/food-scan-bg.png"),linear-gradient(#6a2,#631)}#water{background-image:url("assets/backgrounds/water-bg.png"),linear-gradient(#075,#023)}#workouts{background-image:url("assets/backgrounds/workouts-bg.png"),linear-gradient(#653,#134)}#steps{background-image:url("assets/backgrounds/steps-bg.png"),linear-gradient(#653,#134)}#coach{background-image:url("assets/backgrounds/coach-bg.png"),linear-gradient(#653,#134)}.content{position:relative;z-index:1;height:100%;overflow:auto;padding:14px 14px 24px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{min-height:55px;text-align:center;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.title{margin:0;color:#fff;font-size:27px;line-height:1.04;letter-spacing:.035em;text-shadow:0 3px 14px rgba(0,0,0,.38)}.sub{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:12px;text-shadow:0 2px 8px rgba(0,0,0,.35)}.card,.action{border:1px solid var(--border);border-radius:23px;background:var(--glass);backdrop-filter:blur(6px);box-shadow:0 12px 28px rgba(0,0,0,.12)}.card{padding:13px}.profile-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:10px;margin-bottom:10px}.card.light,.action.light{background:rgba(255,255,255,.34);color:var(--dark);border-color:rgba(255,255,255,.43)}h3{margin:0 0 10px;font-size:16px;line-height:1.15}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:12px;color:rgba(36,33,28,.72);margin-bottom:4px}.field input,.field select{width:100%;height:42px;border-radius:14px;border:1px solid rgba(36,33,28,.14);background:rgba(255,255,255,.30);color:var(--dark);outline:none;padding:0 12px;font-size:16px}.field select{padding-right:32px;font-size:14px}.value{font-size:26px;font-weight:800;line-height:1.1;margin:3px 0 8px}.note{font-size:12px;line-height:1.35;color:rgba(36,33,28,.72);margin:5px 0}.stack{display:grid;gap:10px}.action{min-height:74px;padding:10px;display:grid;grid-template-columns:46px 1fr 18px;gap:10px;align-items:center;text-align:left}.action strong{font-size:17px;line-height:1.08}.action small{display:block;margin-top:3px;font-size:11px;line-height:1.25;color:rgba(36,33,28,.72)}.bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.25)}.bubble svg{width:24px;height:24px}.chev svg{width:18px;height:18px}.segmented{display:grid;gap:7px}.seg-3{grid-template-columns:repeat(3,1fr)}.seg-2{grid-template-columns:repeat(2,1fr)}.tab{min-width:0;padding:8px 4px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.28);font-size:11px;text-align:center;color:inherit}.tab.active{background:rgba(255,255,255,.54);color:var(--dark)}.hidden{display:none!important}.info{padding:14px;text-align:center;font-size:13px;line-height:1.35}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.23);overflow:hidden}.fill{height:100%;background:#56b8ff;border-radius:inherit}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{border-radius:16px;padding:10px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.24);display:flex;justify-content:space-between;gap:8px}.pill{border-radius:999px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.26);padding:8px 10px;font-size:12px}.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.glass{aspect-ratio:1/.74;border-radius:17px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.18);display:grid;place-items:center}.glass.done{background:rgba(87,184,255,.78)}.chat{display:grid;gap:10px;padding-bottom:76px}.msg{max-width:86%;padding:12px 13px;border-radius:19px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(6px);font-size:13px;line-height:1.38;color:var(--dark)}.user{justify-self:end}.ai{justify-self:start}.quick-row{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.quick-row::-webkit-scrollbar{display:none}.chatbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 46px;gap:8px;padding-top:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.12))}.chatbar input{height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.28);padding:0 16px;color:#fff;outline:none}.chatbar input::placeholder{color:rgba(255,255,255,.72)}.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#25352b}.modalwrap{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.40);padding:12px}.modalwrap.open{display:flex}.modal{width:min(100%,620px);max-height:86vh;overflow:auto;border-radius:26px;background:rgba(18,25,26,.92);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);padding:14px;color:#fff}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modalhead h2{margin:0;font-size:22px}.close{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}.modal .card,.modal .action{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.22)}.modal .action small,.modal .note{color:rgba(255,255,255,.72)}.modal input,.modal select{width:100%;height:44px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;padding:0 12px;outline:none}.modal option{color:#111}.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{height:46px;border-radius:16px;background:var(--red);color:#fff;font-weight:700;margin-top:10px;width:100%}@media(max-width:390px){:root{--side:72px}.nav{width:56px;min-height:54px}.nav span{font-size:8px}.content{padding-left:11px;padding-right:11px}.title{font-size:25px}.profile-grid{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr 1fr}.action strong{font-size:16px}.action small{font-size:10.5px}}
</style>
</head>
<body>
<section id="splash" class="splash"></section>
<div class="app">
  <aside class="side">
    <button class="nav active" data-go="profile"><i data-icon="user"></i><span data-i18n="navProfile"></span></button>
    <button class="nav" data-go="menu"><i data-icon="apple"></i><span data-i18n="navMenu"></span></button>
    <button class="nav" data-go="food"><i data-icon="camera"></i><span data-i18n="navFood"></span></button>
    <button class="nav" data-go="water"><i data-icon="drop"></i><span data-i18n="navWater"></span></button>
    <button class="nav" data-go="workouts"><i data-icon="dumbbell"></i><span data-i18n="navWorkouts"></span></button>
    <button class="nav" data-go="steps"><i data-icon="steps"></i><span data-i18n="navSteps"></span></button>
    <button class="nav" data-go="coach"><i data-icon="leaf"></i><span data-i18n="navCoach"></span></button>
    <div class="spacer"></div>
    <button class="nav" id="settingsNav"><i data-icon="settings"></i><span data-i18n="settings"></span></button>
  </aside>
  <main class="main">
    <section id="profile" class="screen active"><div class="content">
      <div class="top"><div><h1 class="title" data-i18n="profileTitle"></h1><p class="sub" data-i18n="profileSub"></p></div></div>
      <div class="profile-grid">
        <div class="card light"><h3 data-i18n="myDetails"></h3><div class="field-grid">
          <div class="field"><label data-i18n="sex"></label><select id="sex"><option value="female" data-i18n="female"></option><option value="male" data-i18n="male"></option></select></div>
          <div class="field"><label data-i18n="age"></label><input id="age" type="number" value="35"></div>
          <div class="field"><label data-i18n="height"></label><input id="height" type="number" value="170"></div>
          <div class="field"><label data-i18n="weight"></label><input id="weight" type="number" value="68"></div>
        </div></div>
        <div class="card light"><h3 data-i18n="bodyGuide"></h3><div id="bmiValue" class="value"></div><p id="bmiText" class="note"></p><p id="targetText" class="note"></p></div>
      </div>
      <div class="stack">
        <button id="openMeasurements" class="action light"><span class="bubble" data-icon="measure"></span><span><strong data-i18n="measurements"></strong><small id="measurementSummary" data-i18n="measurementsSub"></small></span><i class="chev" data-icon="chev"></i></button>
        <button class="action light"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="startPhoto"></strong><small data-i18n="startPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button>
        <button class="action light"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="endPhoto"></strong><small data-i18n="endPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button>
        <button class="action light"><span class="bubble" data-icon="chart"></span><span><strong data-i18n="monthResult"></strong><small data-i18n="monthResultSub"></small></span><i class="chev" data-icon="chev"></i></button>
      </div>
    </div></section>
    <section id="menu" class="screen"><div class="content">
      <div class="top"><div><h1 class="title" data-i18n="menuTitle"></h1></div></div>
      <div class="card"><div class="segmented seg-3"><button class="tab active diet" data-diet="balanced" data-i18n="balanced"></button><button class="tab diet" data-diet="vegetarian" data-i18n="vegetarian"></button><button class="tab diet" data-diet="vegan" data-i18n="vegan"></button></div></div>
      <div id="balancedModes" class="card" style="margin-top:10px"><div class="segmented seg-2"><button class="tab active" data-i18n="fullMenu"></button><button class="tab" data-i18n="twoMeals"></button></div></div>
      <div id="vegArea" class="hidden"><div class="card info" style="margin-top:10px"><strong id="vegTitle"></strong></div></div>
      <div class="stack" style="margin-top:10px"><button class="action light"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week1"></strong><small data-i18n="weekSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week2"></strong><small data-i18n="weekSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week3"></strong><small data-i18n="repeatWeek1"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week4"></strong><small data-i18n="repeatWeek2"></small></span><i class="chev" data-icon="chev"></i></button></div>
    </div></section>
    <section id="food" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="foodTitle"></h1><p class="sub" data-i18n="foodSub"></p></div></div><div class="stack"><button class="action light"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="takePhoto"></strong><small data-i18n="takePhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="upload"></span><span><strong data-i18n="uploadPhoto"></strong><small data-i18n="uploadPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="file"></span><span><strong data-i18n="myScans"></strong><small data-i18n="myScansSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="spark"></span><span><strong data-i18n="foodAdvice"></strong><small data-i18n="foodAdviceSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
    <section id="water" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="waterTitle"></h1><p class="sub" data-i18n="waterSub"></p></div></div><div class="card light"><div class="mini-grid"><div><div class="note" data-i18n="dailyGoal"></div><div class="value">2 L</div></div><div><div class="note" data-i18n="today"></div><div class="value"><span id="waterNow">0</span> / 2 L</div></div></div><div class="progress"><div id="waterFill" class="fill"></div></div><div id="glasses" class="glasses"></div><p id="waterLeft" class="note"></p></div><div class="small" style="margin-top:10px"><button class="pill addWater" data-ml="250">+250 ml</button><button class="pill addWater" data-ml="500">+500 ml</button><button class="pill" id="resetWater" data-i18n="reset"></button></div></div></section>
    <section id="workouts" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="workoutsTitle"></h1><p class="sub" data-i18n="workoutsSub"></p></div></div><div class="card"><h3 data-i18n="level"></h3><div class="segmented seg-3"><button class="tab active" data-i18n="beginner"></button><button class="tab" data-i18n="middle"></button><button class="tab" data-i18n="advanced"></button></div></div><div class="stack" style="margin-top:10px"><button class="action light"><span class="bubble" data-icon="fire"></span><span><strong data-i18n="cardio"></strong><small data-i18n="cardioSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="dumbbell"></span><span><strong data-i18n="strength"></strong><small data-i18n="strengthSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="yoga"></span><span><strong data-i18n="yoga"></strong><small data-i18n="yogaSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="spine"></span><span><strong data-i18n="spine"></strong><small data-i18n="spineSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
    <section id="steps" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="stepsTitle"></h1><p class="sub" data-i18n="stepsSub"></p></div></div><div class="card light"><div class="note" data-i18n="stepsGoal"></div><div class="value">5 860 / 8 000</div><div class="progress"><div class="fill" style="width:73%"></div></div><div class="mini-grid" style="margin-top:10px"><div class="small"><b>4.3 km</b><span data-i18n="distance"></span></div><div class="small"><b>260 kcal</b><span data-i18n="calories"></span></div></div></div><div class="stack" style="margin-top:10px"><button class="action light"><span class="bubble" data-icon="star"></span><span><strong data-i18n="streak"></strong><small data-i18n="streakSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action light"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="calendar"></strong><small data-i18n="calendarSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
    <section id="coach" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="coachTitle"></h1><p class="sub" data-i18n="coachSub"></p></div></div><div id="chat" class="chat"><div class="msg user" data-i18n="chatUser"></div><div class="msg ai" data-i18n="chatAi"></div><div class="quick-row"><button class="tab quick" data-reply="motivation" data-i18n="noMotivation"></button><button class="tab quick" data-reply="tired" data-i18n="tired"></button><button class="tab quick" data-reply="broke" data-i18n="brokePlan"></button><button class="tab quick" data-reply="pain" data-i18n="pain"></button></div><div class="chatbar"><input id="coachInput" data-placeholder="coachPh"><button id="send" class="send" data-icon="send"></button></div></div></div></section>
  </main>
</div>
<div id="settingsModal" class="modalwrap"><div class="modal"><div class="modalhead"><h2 data-i18n="settings"></h2><button type="button" class="close" id="closeSettings" data-icon="close"></button></div><div class="stack"><div class="card"><h3 data-i18n="language"></h3><select id="languageSelect"></select></div><button class="action"><span class="bubble" data-icon="crown"></span><span><strong data-i18n="premium"></strong><small data-i18n="premiumSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="user"></span><span><strong data-i18n="account"></strong><small data-i18n="accountSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="mail"></span><span><strong data-i18n="support"></strong><small>aislang.business@gmail.com</small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-i18n="privacy"></strong><small data-i18n="privacySub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-i18n="terms"></strong><small data-i18n="termsSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></div>
<div id="measureModal" class="modalwrap"><div class="modal"><div class="modalhead"><h2 data-i18n="measurements"></h2><button type="button" class="close" id="closeMeasure" data-icon="close"></button></div><div class="measure-grid"><label><span data-i18n="chest"></span><input id="mChest" type="number"></label><label><span data-i18n="waist"></span><input id="mWaist" type="number"></label><label><span data-i18n="belly"></span><input id="mBelly" type="number"></label><label><span data-i18n="hips"></span><input id="mHips" type="number"></label><label><span data-i18n="arm"></span><input id="mArm" type="number"></label><label><span data-i18n="thigh"></span><input id="mThigh" type="number"></label></div><button id="saveMeasure" class="save" data-i18n="save"></button></div></div>

const measureIds=['mChest','mWaist','mBelly','mHips','mArm','mThigh'];function loadMeasures(){let m=JSON.parse(localStorage.getItem('measures')||'{}');measureIds.forEach(id=>document.getElementById(id).value=m[id]||'')}function updateMeasurementsSummary(){let m=JSON.parse(localStorage.getItem('measures')||'{}');let vals=measureIds.map(id=>m[id]).filter(Boolean);measurementSummary.textContent=vals.length?`${vals.length}/6 ${t('saved')}`:t('measurementsSub')}saveMeasure.onclick=()=>{let m={};measureIds.forEach(id=>m[id]=document.getElementById(id).value);localStorage.setItem('measures',JSON.stringify(m));updateMeasurementsSummary();measureModal.classList.remove('open')};
let water=Number(localStorage.waterMl||0),goal=2000;function updateWater(){glasses.innerHTML='';let done=Math.floor(water/250);for(let i=1;i<=8;i++){let b=document.createElement('button');b.className='glass'+(i<=done?' done':'');b.textContent=i;b.onclick=()=>{water=i*250;localStorage.waterMl=water;updateWater()};glasses.appendChild(b)}waterNow.textContent=(water/1000).toFixed(water%1000?2:0);waterFill.style.width=Math.min(100,water/goal*100)+'%';waterLeft.textContent=done>=8?t('goalDone'):`${8-done} ${t('glassesLeft')}`}document.querySelectorAll('.addWater').forEach(b=>b.onclick=()=>{water=Math.min(goal,water+Number(b.dataset.ml));localStorage.waterMl=water;updateWater()});resetWater.onclick=()=>{water=0;localStorage.waterMl=0;updateWater()};
function addMsg(text,who){let m=document.createElement('div');m.className='msg '+who;m.textContent=text;chat.insertBefore(m,chat.querySelector('.chatbar'));m.scrollIntoView({behavior:'smooth'})}function replyMap(){return{motivation:t('replyMotivation'),tired:t('replyTired'),broke:t('replyBroke'),pain:t('replyPain')}}document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{addMsg(b.textContent,'user');setTimeout(()=>addMsg(replyMap()[b.dataset.reply]||t('replyMotivation'),'ai'),150)});send.onclick=()=>{if(!coachInput.value.trim())return;addMsg(coachInput.value,'user');coachInput.value='';setTimeout(()=>addMsg(t('replyMotivation'),'ai'),150)};coachInput.onkeydown=e=>{if(e.key==='Enter')send.click()};
window.onload=()=>{loadMeasures();applyTranslations();setTimeout(()=>splash.classList.add('hide'),950)};
</script>
