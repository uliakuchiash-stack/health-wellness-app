
<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Wellness App</title>
<style>
:root{--side:78px;--dark:#071014;--red:#ff4654;--glass:rgba(255,255,255,.34);--line:rgba(255,255,255,.42);--ink:#27231e;--muted:rgba(39,35,30,.72);--radius:24px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#071014;color:#fff;overflow:hidden}button,input,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:var(--side) 1fr;overflow:hidden;background:#071014}.splash{position:fixed;inset:0;z-index:100;background:#dfe9e2 url("assets/backgrounds/splash-screen-ocean.png") center/cover no-repeat;transition:.45s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.side{z-index:5;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(2,8,11,.82);backdrop-filter:blur(16px)}.nav{width:60px;min-height:56px;border-radius:18px;display:grid;place-items:center;gap:3px;padding:7px 2px;color:rgba(255,255,255,.78)}.nav.active{background:linear-gradient(135deg,#ff6470,#ff3d4b);color:#fff;box-shadow:0 12px 24px rgba(255,61,75,.25)}.nav svg{width:24px;height:24px;stroke-width:1.85}.nav span{font-size:8.6px;line-height:1.05;text-align:center;max-width:60px;word-break:break-word}.spacer{flex:1}
.main{position:relative;overflow:hidden}.screen{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;pointer-events:none;transition:.2s;transform:translateX(8px)}.screen.active{opacity:1;pointer-events:auto;transform:none}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.03) 48%,rgba(0,0,0,.12))}
#profile{background-image:url("assets/backgrounds/profile-bg.png")}#meal{background-image:url("assets/backgrounds/menu-bg.png")}#food{background-image:url("assets/backgrounds/food-scan-bg.png")}#water{background-image:url("assets/backgrounds/water-bg.png")}#workouts{background-image:url("assets/backgrounds/workouts-bg.png")}#steps{background-image:url("assets/backgrounds/steps-bg.png")}#coach{background-image:url("assets/backgrounds/coach-bg.png")}
.content{position:relative;z-index:1;height:100%;overflow:auto;padding:14px 14px 22px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{text-align:center;min-height:52px;margin-bottom:8px;display:grid;place-items:center}.title{font-size:clamp(22px,6.5vw,30px);letter-spacing:.04em;line-height:1.04;margin:0;text-shadow:0 3px 16px rgba(0,0,0,.45)}.sub{font-size:12px;margin:4px 0 0;color:rgba(255,255,255,.82);text-shadow:0 2px 10px rgba(0,0,0,.35)}
.card,.action{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(5px);box-shadow:0 12px 30px rgba(0,0,0,.12);color:var(--ink)}.card{padding:13px}.grid2{display:grid;grid-template-columns:1.22fr .95fr;gap:10px;margin-bottom:10px}h3{font-size:16px;line-height:1.1;margin:0 0 10px}.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}label{font-size:11.5px;color:var(--muted)}input,select{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(39,35,30,.15);background:rgba(255,255,255,.3);color:var(--ink);outline:none;padding:9px 10px}select{padding-right:26px;font-size:13px}option{color:#111;background:#fff}.value{font-size:28px;font-weight:800;line-height:1.06}.note{font-size:11.5px;line-height:1.35;color:var(--muted);margin:7px 0 0}
.stack{display:grid;gap:10px}.action{min-height:74px;padding:10px;display:grid;grid-template-columns:48px 1fr 16px;align-items:center;gap:10px;text-align:left}.bubble{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.25)}.bubble svg{width:25px;height:25px}.action strong{font-size:17px;line-height:1.08}.action small{display:block;font-size:11.2px;line-height:1.25;color:var(--muted);margin-top:3px}.chev svg{width:17px;height:17px}
.segment{display:grid;gap:7px}.segment.three{grid-template-columns:repeat(3,1fr)}.segment.two{grid-template-columns:repeat(2,1fr)}.tab{padding:9px 4px;border-radius:999px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.35);color:var(--ink);font-size:11px;text-align:center;min-width:0}.tab.active{background:rgba(255,255,255,.62)}.hidden{display:none!important}.info{font-size:13px;text-align:center;line-height:1.35}.progress{height:8px;border-radius:999px;background:rgba(39,35,30,.18);overflow:hidden}.fill{height:100%;border-radius:999px;background:#58b9ff}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{border-radius:999px;background:rgba(255,255,255,.36);border:1px solid rgba(255,255,255,.4);padding:8px 12px;color:var(--ink);font-size:12px}.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.glass{aspect-ratio:1/.75;border-radius:17px;background:rgba(255,255,255,.24);border:1px solid rgba(39,35,30,.16);color:var(--ink)}.glass.done{background:rgba(88,185,255,.78);color:#fff}
.chat{display:grid;gap:10px;padding-bottom:70px}.msg{max-width:86%;padding:12px 13px;border-radius:19px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.32);color:var(--ink);font-size:13px;line-height:1.36;backdrop-filter:blur(5px)}.user{justify-self:end}.ai{justify-self:start}.quick{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.chatbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 46px;gap:8px;padding-top:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.15))}.send{width:46px;height:46px;border-radius:50%;background:#fff;color:#25352d;display:grid;place-items:center}
.modalWrap{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.38);padding:12px}.modalWrap.open{display:flex}.modal{width:min(100%,620px);max-height:86vh;overflow:auto;border-radius:26px;background:rgba(18,25,26,.9);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);padding:14px;color:#fff}.modal .card,.modal .action{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff}.modal label,.modal .note,.modal small{color:rgba(255,255,255,.74)}.modal input,.modal select{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modalHead h2{margin:0;font-size:23px}.closeBtn{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#fff}.measureGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.saveBtn{width:100%;border-radius:18px;background:linear-gradient(135deg,#ff6470,#ff3d4b);padding:13px;color:#fff;font-weight:700;margin-top:10px}
@media(max-width:390px){:root{--side:72px}.nav{width:56px}.nav span{font-size:8px}.content{padding-left:11px;padding-right:11px}.grid2{grid-template-columns:1.2fr .9fr}.card{padding:12px}.fieldGrid{gap:7px}.value{font-size:26px}.action strong{font-size:16px}.action small{font-size:10.5px}}
</style></head><body>
<div id="splash" class="splash"></div><div class="app"><aside class="side">
<button class="nav active" data-go="profile"><i data-icon="user"></i><span data-i18n="navProfile"></span></button><button class="nav" data-go="meal"><i data-icon="apple"></i><span data-i18n="navMeal"></span></button><button class="nav" data-go="food"><i data-icon="camera"></i><span data-i18n="navFood"></span></button><button class="nav" data-go="water"><i data-icon="drop"></i><span data-i18n="navWater"></span></button><button class="nav" data-go="workouts"><i data-icon="dumbbell"></i><span data-i18n="navWorkouts"></span></button><button class="nav" data-go="steps"><i data-icon="steps"></i><span data-i18n="navSteps"></span></button><button class="nav" data-go="coach"><i data-icon="leaf"></i><span data-i18n="navCoach"></span></button><div class="spacer"></div><button class="nav" id="openSettings"><i data-icon="settings"></i><span data-i18n="settings"></span></button></aside><main class="main">
<section id="profile" class="screen active"><div class="content"><div class="top"><div><h1 class="title" data-i18n="profileTitle"></h1><p class="sub" data-i18n="profileSub"></p></div></div><div class="grid2"><div class="card"><h3 data-i18n="myDetails"></h3><div class="fieldGrid"><div class="field"><label data-i18n="sex"></label><select id="sex"><option value="female" data-i18n="female"></option><option value="male" data-i18n="male"></option></select></div><div class="field"><label data-i18n="age"></label><input id="age" type="number" value="38"></div><div class="field"><label data-i18n="height"></label><input id="height" type="number" value="174"></div><div class="field"><label data-i18n="weight"></label><input id="weight" type="number" value="72"></div></div></div><div class="card"><h3 data-i18n="bodyGuide"></h3><div id="bmiValue" class="value"></div><p id="bmiRange" class="note"></p><p id="wellnessTarget" class="note"></p></div></div><div class="stack"><button class="action" id="openMeasurements"><span class="bubble" data-icon="measure"></span><span><strong data-i18n="measurements"></strong><small id="measureSummary" data-i18n="measurementsSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="startPhoto"></strong><small data-i18n="startPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="endPhoto"></strong><small data-i18n="endPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="chart"></span><span><strong data-i18n="monthResult"></strong><small data-i18n="monthResultSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="meal" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="mealTitle"></h1></div></div><div class="card"><div class="segment three"><button class="tab diet active" data-diet="balanced" data-i18n="balanced"></button><button class="tab diet" data-diet="vegetarian" data-i18n="vegetarian"></button><button class="tab diet" data-diet="vegan" data-i18n="vegan"></button></div></div><div id="balancedModes" class="card" style="margin-top:10px"><div class="segment two"><button class="tab active" data-i18n="fullMenu"></button><button class="tab" data-i18n="twoMeals"></button></div></div><div id="futurePlan" class="card info hidden" style="margin-top:10px"><strong data-i18n="comingSoon"></strong></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week1"></strong><small data-i18n="weekSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week2"></strong><small data-i18n="weekSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week3"></strong><small data-i18n="repeatWeek1"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="calendar"></span><span><strong data-i18n="week4"></strong><small data-i18n="repeatWeek2"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="food" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="foodTitle"></h1><p class="sub" data-i18n="foodSub"></p></div></div><div class="stack"><button class="action"><span class="bubble" data-icon="camera"></span><span><strong data-i18n="takePhoto"></strong><small data-i18n="takePhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="upload"></span><span><strong data-i18n="uploadPhoto"></strong><small data-i18n="uploadPhotoSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-i18n="myScans"></strong><small data-i18n="myScansSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="water" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="waterTitle"></h1><p class="sub" data-i18n="waterSub"></p></div></div><div class="card"><div class="row"><div><label data-i18n="dailyGoal"></label><div class="value">2 L</div></div><div><label data-i18n="today"></label><div class="value"><span id="waterNow">0</span>/2</div></div></div><div class="progress" style="margin-top:10px"><div id="waterFill" class="fill"></div></div><div id="glasses" class="glasses"></div><p id="waterLeft" class="note"></p></div><div class="row" style="margin-top:10px"><button class="pill addWater" data-ml="250">+250 ml</button><button class="pill addWater" data-ml="500">+500 ml</button><button class="pill" id="resetWater" data-i18n="reset"></button></div></div></section>
<section id="workouts" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="workoutsTitle"></h1><p class="sub" data-i18n="workoutsSub"></p></div></div><div class="card"><h3 data-i18n="level"></h3><div class="segment three"><button class="tab active" data-i18n="beginner"></button><button class="tab" data-i18n="middle"></button><button class="tab" data-i18n="advanced"></button></div></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-icon="fire"></span><span><strong data-i18n="cardio"></strong><small data-i18n="cardioSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="dumbbell"></span><span><strong data-i18n="strength"></strong><small data-i18n="strengthSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="yoga"></span><span><strong data-i18n="yoga"></strong><small data-i18n="yogaSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="steps" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="stepsTitle"></h1><p class="sub" data-i18n="stepsSub"></p></div></div><div class="card"><label data-i18n="stepsGoal"></label><div class="value">5 860 / 8 000</div><div class="progress" style="margin-top:10px"><div class="fill" style="width:73%"></div></div></div><div class="stack" style="margin-top:10px"><button class="action"><span class="bubble" data-icon="star"></span><span><strong data-i18n="streak"></strong><small data-i18n="streakSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></section>
<section id="coach" class="screen"><div class="content"><div class="top"><div><h1 class="title" data-i18n="coachTitle"></h1><p class="sub" data-i18n="coachSub"></p></div></div><div id="chat" class="chat"><div class="msg user" data-i18n="chatUser"></div><div class="msg ai" data-i18n="chatAi"></div><div class="quick"><button class="tab quickBtn" data-reply="motivation" data-i18n="noMotivation"></button><button class="tab quickBtn" data-reply="tired" data-i18n="tired"></button><button class="tab quickBtn" data-reply="broke" data-i18n="brokePlan"></button><button class="tab quickBtn" data-reply="pain" data-i18n="pain"></button></div><div class="chatbar"><input id="coachInput" data-placeholder="coachPlaceholder"><button id="sendCoach" class="send" data-icon="send"></button></div></div></div></section>
</main></div>
<div class="modalWrap" id="settingsModal"><div class="modal"><div class="modalHead"><h2 data-i18n="settings"></h2><button class="closeBtn" data-close="settingsModal" data-icon="close" type="button"></button></div><div class="stack"><div class="card"><h3 data-i18n="language"></h3><select id="languageSelect"></select></div><button class="action"><span class="bubble" data-icon="crown"></span><span><strong data-i18n="premium"></strong><small data-i18n="premiumSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="user"></span><span><strong data-i18n="account"></strong><small data-i18n="accountSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="bell"></span><span><strong data-i18n="notifications"></strong><small data-i18n="notificationsSub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="mail"></span><span><strong data-i18n="support"></strong><small>aislang.business@gmail.com</small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-i18n="privacy"></strong><small data-i18n="privacySub"></small></span><i class="chev" data-icon="chev"></i></button><button class="action"><span class="bubble" data-icon="file"></span><span><strong data-i18n="terms"></strong><small data-i18n="termsSub"></small></span><i class="chev" data-icon="chev"></i></button></div></div></div>
<div class="modalWrap" id="measureModal"><div class="modal"><div class="modalHead"><h2 data-i18n="measurements"></h2><button class="closeBtn" data-close="measureModal" data-icon="close" type="button"></button></div><div class="measureGrid"><div class="field"><label data-i18n="chest"></label><input id="mChest" type="number" data-placeholder="cm"></div><div class="field"><label data-i18n="waist"></label><input id="mWaist" type="number" data-placeholder="cm"></div><div class="field"><label data-i18n="belly"></label><input id="mBelly" type="number" data-placeholder="cm"></div><div class="field"><label data-i18n="hips"></label><input id="mHips" type="number" data-placeholder="cm"></div><div class="field"><label data-i18n="arm"></label><input id="mArm" type="number" data-placeholder="cm"></div><div class="field"><label data-i18n="thigh"></label><input id="mThigh" type="number" data-placeholder="cm"></div></div><button class="saveBtn" id="saveMeasurements" data-i18n="save"></button></div></div>
<script>
const icons={user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg>',apple:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 7c3-3 7-2 8 1 1 4-2 11-6 11-1 0-1.5-.5-2-.5s-1 .5-2 .5C6 19 3 12 4 8c1-3 5-4 8-1z"/><path d="M12 7c0-3 2-5 5-5"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="14" r="4"/></svg>',drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3s7 7 7 12a7 7 0 0 1-14 0c0-5 7-12 7-12z"/></svg>',dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>',steps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 20c-2 0-3-1.5-3-3.2 0-2.2 1.5-5.3 3.2-5.3 1.5 0 2.3 1.9 2.3 3.8C10.5 17.6 9.8 20 8 20z"/><path d="M16.3 14c-1.8-.2-2.4-2.4-2.1-4.3.3-2 1.4-3.7 2.9-3.5 1.8.2 2.8 3.6 2.4 5.7-.3 1.7-1.4 2.3-3.2 2.1z"/></svg>',leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 4C11 4 6 9 6 18c8 0 14-5 14-14z"/><path d="M6 18c3-4 6-6 10-8"/></svg>',settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.8-1L14.4 3h-4.8L9.2 6a7 7 0 0 0-1.8 1L5 6 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5L5 18l2.4-1a7 7 0 0 0 1.8 1l.4 3h4.8l.4-3a7 7 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>',chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 18l6-6-6-6"/></svg>',measure:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3v18M6 5h8M6 9h5M6 13h8M6 17h5"/></svg>',chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20h16M6 16l4-4 3 3 5-7"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',file:'<svg viewBox="0 0 24 24" let currentLang=localStorage.getItem("appLang")||"en";
function t(key){return translations[currentLang]?.[key]||translations.en?.[key]||key}
function applyTranslations(){document.documentElement.lang=currentLang;document.documentElement.dir="ltr";document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll("[data-placeholder]").forEach(el=>el.placeholder=t(el.dataset.placeholder));updateBMI();updateMeasurementsSummary();updateWater();}
const languageSelect=document.getElementById("languageSelect");languageNames.forEach(([code,name])=>{const o=document.createElement("option");o.value=code;o.textContent=name;languageSelect.appendChild(o)});languageSelect.value=currentLang;languageSelect.addEventListener("change",()=>{currentLang=languageSelect.value;localStorage.setItem("appLang",currentLang);applyTranslations()});
document.querySelectorAll("[data-go]").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===btn.dataset.go));document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n===btn))}));
openSettings.onclick=()=>settingsModal.classList.add("open");openMeasurements.onclick=()=>measureModal.classList.add("open");document.querySelectorAll("[data-close]").forEach(btn=>btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();document.getElementById(btn.dataset.close).classList.remove("open")}));document.querySelectorAll(".modalWrap").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open")}));document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>e.stopPropagation()));document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{[...b.parentElement.children].forEach(x=>x.classList.remove("active"));b.classList.add("active")}));document.querySelectorAll(".diet").forEach(b=>b.addEventListener("click",()=>{const on=b.dataset.diet==="balanced";balancedModes.classList.toggle("hidden",!on);futurePlan.classList.toggle("hidden",on)}));
function updateBMI(){const h=+height.value/100,w=+weight.value;if(!h||!w)return;const bmi=w/(h*h),min=18.5*h*h,max=24.9*h*h,tm=(sex.value==="female"?19.5:20.5)*h*h,tx=(sex.value==="female"?21.3:22.5)*h*h;bmiValue.textContent=`BMI: ${bmi.toFixed(1)}`;bmiRange.textContent=`${t("bmiRange")}: ${min.toFixed(0)}–${max.toFixed(0)} kg`;wellnessTarget.textContent=`${t("wellnessTarget")}: ${tm.toFixed(0)}–${tx.toFixed(0)} kg`;}
["sex","age","height","weight"].forEach(id=>["input","change","keyup","blur"].forEach(ev=>document.getElementById(id).addEventListener(ev,updateBMI)));
function loadM(){try{return JSON.parse(localStorage.getItem("bodyMeasurements")||"{}")}catch{return {}}}function updateMeasurementsSummary(){const m=loadM();[["mChest","chest"],["mWaist","waist"],["mBelly","belly"],["mHips","hips"],["mArm","arm"],["mThigh","thigh"]].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.value=m[k]||""});const vals=[m.chest,m.waist,m.belly,m.hips,m.arm,m.thigh].filter(Boolean);measureSummary.textContent=vals.length?`${vals.join(" / ")} ${t("cm")}`:t("measurementsSub")}saveMeasurements.onclick=()=>{const m={chest:mChest.value,waist:mWaist.value,belly:mBelly.value,hips:mHips.value,arm:mArm.value,thigh:mThigh.value};localStorage.setItem("bodyMeasurements",JSON.stringify(m));updateMeasurementsSummary();measureModal.classList.remove("open")};
let water=+localStorage.getItem("waterMl")||0,goal=2000;function updateWater(){if(!glasses)return;glasses.innerHTML="";const done=Math.floor(water/250);for(let i=1;i<=8;i++){const b=document.createElement("button");b.className="glass"+(i<=done?" done":"");b.textContent=i;b.onclick=()=>{water=i*250;localStorage.setItem("waterMl",water);updateWater()};glasses.appendChild(b)}waterNow.textContent=(water/1000).toFixed(water%1000?2:0);waterFill.style.width=Math.min(100,water/goal*100)+"%";waterLeft.textContent=done>=8?t("goalDone"):`${8-done} ${t("glassesLeft")}`}document.querySelectorAll(".addWater").forEach(b=>b.onclick=()=>{water=Math.min(goal,water+(+b.dataset.ml));localStorage.setItem("waterMl",water);updateWater()});resetWater.onclick=()=>{water=0;localStorage.setItem("waterMl",0);updateWater()};
function addMsg(text,who){const m=document.createElement("div");m.className="msg "+who;m.textContent=text;chat.insertBefore(m,chat.querySelector(".chatbar"));m.scrollIntoView({behavior:"smooth"})}document.querySelectorAll(".quickBtn").forEach(b=>b.onclick=()=>{addMsg(b.textContent,"user");const key={motivation:"replyMotivation",tired:"replyTired",broke:"replyBroke",pain:"replyPain"}[b.dataset.reply];setTimeout(()=>addMsg(t(key),"ai"),160)});sendCoach.onclick=()=>{if(!coachInput.value.trim())return;addMsg(coachInput.value,"user");coachInput.value="";setTimeout(()=>addMsg(t("replyMotivation"),"ai"),160)};coachInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendCoach.click()});window.onload=()=>{applyTranslations();setTimeout(()=>splash.classList.add("hide"),850)};
</script></body></html>
